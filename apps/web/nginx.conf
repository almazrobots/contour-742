# Веб «Инспектора ИИ», профиль gpu (T-060). Подключается в http-контекст nginx-unprivileged (conf.d).
# Все add_header — только на уровне server: add_header внутри location отменяет ВСЕ унаследованные
# (так страница однажды уехала в прод без CSP). Разница по кэшу — через map, а не через location.

map $uri $inspector_cache {
  ~^/assets/  "public, max-age=31536000, immutable";  # имена с хешем от Vite
  ~^/fonts/   "public, max-age=2592000";
  default     "no-store";                              # index.html и всё прочее — всегда свежие
}

# CSP тоже через map (T-131): /docs/ — самодостаточные страницы ГЕРЫ, отчёты и методика со встроенным кодом и шрифтами
# в data:, собранные с мака (scripts/demo-docs.mjs), без пользовательского ввода; приложению встроенный скрипт запрещён.
map $uri $inspector_script_src {
  ~^/docs/  "script-src 'self' 'unsafe-inline'; font-src 'self' data:";
  default   "script-src 'self'; font-src 'self'";
}

# NFR-IDS (ТЗ 12.9, TZA-12.9-02, T-138): первый рубеж от DDoS прикладного уровня — лимиты на адрес клиента.
# API держит второй рубеж (ведро токенов и детектор атак, services/ids.ts). Отказ — 429, как у API.
limit_req_zone  $binary_remote_addr zone=inspector_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=inspector_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=inspector_conn:10m;

server {
  listen 8443 ssl;
  http2 on;
  server_tokens off;
  # Compress large cards before they traverse the remote demonstration proxy.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 2;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # NFR-TLS (ТЗ 12.3): TLS 1.3; сертификат и ключ — из того же ${TLS_DIR}, что у API (read-only)
  ssl_certificate     /run/tls/server.crt;
  ssl_certificate_key /run/tls/server.key;
  ssl_protocols       TLSv1.3;

  # пакет до 200 МБ (ТЗ 9.1) + служебные поля формы
  client_max_body_size 210m;

  # R2 T-138 (E1-H1): web опубликован только на 127.0.0.1 — перед ним прокси хоста (Caddy демо, прокси стенда), и
  # соединения приходят с адреса шлюза docker: без real_ip лимиты и детектор видели бы ВСЕХ клиентов одним адресом
  # (глобальный отказ в обслуживании). Адрес клиента — из X-Forwarded-For только от частных адресов docker и только
  # ПОСЛЕДНИЙ в цепочке (real_ip_recursive off): его записал прокси хоста, подставить свой клиент не может. Caddy v2
  # перезаписывает XFF адресом клиента (входящий без trusted_proxies не принимает); API доверяет только web (T-131).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive off;

  # NFR-IDS: не больше 50 соединений с адреса; медленные клиенты (slowloris) не держат воркеры — тайм-ауты заголовков
  # и тела; длинные адреса отрезаются до API (буфер заголовков 8 КБ). Загрузка пакета — отдельная location ниже.
  limit_conn          inspector_conn 50;
  limit_conn_status   429;
  limit_req_status    429;
  client_header_timeout 15s;
  client_body_timeout   60s;
  send_timeout          60s;
  keepalive_timeout     30s;
  large_client_header_buffers 4 8k;

  root /usr/share/nginx/html;
  # Mounted annotation feature; the normal platform keeps root URLs.
  rewrite ^/verification/(.*)$ /$1 last;

  add_header Content-Security-Policy "default-src 'self'; $inspector_script_src; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control $inspector_cache always;

  # API — по TLS внутри сети compose, с проверкой сертификата API по корню стенда
  proxy_ssl_verify              on;
  proxy_ssl_trusted_certificate /run/tls/ca.crt;
  proxy_ssl_name                api;
  proxy_ssl_server_name         on;
  proxy_ssl_protocols           TLSv1.3;
  proxy_set_header Host              $host;
  # T-090: адрес клиента — только $remote_addr. $proxy_add_x_forwarded_for дописывал к присланному клиентом заголовку,
  # и клиент мог подставить любой адрес: обходил лимиты и блокировки API и писал чужой IP в журнал аудита
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_request_buffering off;   # загрузка пакета потоком, без копии на диске nginx
  proxy_read_timeout      300s;

  location /api/      { limit_req zone=inspector_api burst=100 nodelay; proxy_pass https://api:8810; }
  # вход: 10 попыток в минуту с адреса и всплеск до 5 — подбор пароля упирается в прокси раньше API (T-090)
  location = /api/v1/auth/login { limit_req zone=inspector_login burst=5 nodelay; proxy_pass https://api:8810; }
  # приём части пакета (до 200 МБ) кладёт файлы в S3 до ответа: на медленном канале это минуты (T-129)
  location = /api/v1/documents/upload { proxy_pass https://api:8810; proxy_read_timeout 1800s; proxy_send_timeout 1800s; }
  location = /health  { limit_req zone=inspector_api burst=20 nodelay; proxy_pass https://api:8810; }  # R2 T-138, E1-M2
  location = /metrics { return 404; }  # метрики снимает Prometheus напрямую с API, наружу не отдаются

  # Воркер PDF.js — ES-модуль .mjs. В mime.types nginx расширения нет: отдавался application/octet-stream, и при
  # nosniff браузер не загружал модуль — лист на экране верификации не рисовался (T-129, стенд). default_type
  # срабатывает именно потому, что mjs в карте типов нет; add_header здесь нет — заголовки server наследуются.
  location ~* \.mjs$ { default_type text/javascript; try_files $uri =404; }

  # Missing documentation must be a real 404, never the SPA shell.
  location ^~ /docs/ { try_files $uri $uri/ =404; }

  # SPA: маршруты вида /#/… и прямые пути отдают index.html
  location / { try_files $uri /index.html; }
}
