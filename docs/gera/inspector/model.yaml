# Ограничения — допущение проекта (у автора метода НФТ нет). Реализация — тем же форматом.
constraints:
  - {id: NFR-API, title: "REST over HTTPS, JSON, схема OpenAPI 3.0"}
  - {id: NFR-API-VALIDATE, title: "Каждый маршрут API описан в OpenAPI 3.0; запрос и ответ валидируются по той же схеме (ТЗ 1.3 «с обязательной валидацией схемы»); гейт не пропускает маршрут без схемы"}
  - {id: NFR-API-JSON, title: "Тело запроса — только application/json (multipart — только загрузка файлов), иной тип — 415; все ошибки в одном формате {error, details} по схеме Error OpenAPI, включая 404 и 415 фреймворка"}
  - {id: NFR-TLS-INTERNAL, title: "Внутренние каналы тоже зашифрованы: API → ML по HTTPS TLS 1.3 с внутренним CA, API → RabbitMQ по amqps; в стенде и профиле gpu открытого текста между сервисами нет", mode: prod}
  - {id: NFR-ASYNC, title: "Асинхронная pull-модель: process_id и эндпоинт статуса"}
  - {id: NFR-STACK, title: "React, Node.js, Python ≥ 3.11, RabbitMQ", adr: ADR-0001}
  - {id: NFR-DB, title: "Хранилище — PostgreSQL 18 во всех профилях (сервер в эксплуатации, PGlite в dev и тестах); версионированные миграции с контрольной суммой; транзакции", adr: ADR-0003}
  - {id: NFR-OCR-Q, title: "OCR: Character Accuracy ≥ 0,95; Exact Match ключевых полей ≥ 0,90", mode: gpu}
  - {id: NFR-CV, title: "CV: масштаб по размерной линейке, измерение расстояний на чертеже", mode: gpu}
  - {id: NFR-PERF, title: "Производительность по ТЗ §11 (время OCR, сравнения, протокола, p95 API)", mode: gpu}
  - {id: NFR-SLA, title: "Доступность 99,9 % круглосуточно", mode: prod}
  - {id: NFR-LOAD-100, title: "100 одновременных сессий инспекторов: ни одного ответа 5xx, p95 ответа API ≤ 200 мс (ТЗ 11-10); замер — scripts/load-100.mjs (T-075)", mode: prod}
  - {id: NFR-RECOVERY, title: "Учение по восстановлению из бэкапа: RTO ≤ 1 ч, RPO ≤ 15 мин, число строк сверено (T-072)", mode: prod, adr: ADR-0004}
  - {id: NFR-AUTH, title: "Вход по логину и паролю"}
  - {id: NFR-ROLES, title: "Роли: инспектор, супервизор, администратор, ML-инженер, куратор"}
  - {id: NFR-CRYPTO, title: "Шифрование в покое: том PostgreSQL на dm-crypt/LUKS (стенд без него не стартует); локальные блобы — AES-256-GCM с key id и ротацией; S3 — клиентское шифрование (ADR-0006); бэкап и WAL — CMS AuthEnveloped на сертификат получателя (T-137)", mode: prod, adr: ADR-0004}
  - {id: NFR-TLS, title: "API только по HTTPS с TLS 1.3; в профиле gpu без сертификата сервер не стартует", mode: prod}
  - {id: NFR-IMAGES, title: "Эксплуатационный контур — из образов по digest: гейт собирает, запускает каждый образ и сверяет ревизию; в рантайме нет пакетного менеджера и root, код только для чтения; интерфейс — по HTTPS с CSP", mode: prod}
  - {id: NFR-LOGRET, title: "Хранение логов 90 дней / 1 год для событий безопасности", mode: prod}
  - {id: NFR-PDN, title: "Обработка ПДн по 152-ФЗ: реестр ПДн (гейт на миграции), маскирование в логах, API и «РиН», обезличивание по сроку, сведения субъекту с аудитом доступа, хранение только в РФ (T-137)", mode: prod, adr: ADR-0004}
  - {id: NFR-INTEGRITY, title: "Целостность данных (187-ФЗ): ежедневная сверка хешей хранилища"}
  - {id: NFR-BACKUP, title: "Бэкап PostgreSQL в S3: ежедневный базовый + непрерывный WAL-архив (RPO ≤ 15 мин), версионирование и object lock, хранение 30 дней, проверенное восстановление", mode: prod, adr: ADR-0004}
  - {id: NFR-OBJSTORE, title: "Объектное хранилище — только через S3-совместимый API без привязки к провайдеру (BlobStore: fs | tiered = кэш-том + S3); объекты зашифрованы на клиенте AES-256-GCM; сервисный аккаунт на потребителя; ключи вне git, засвеченный ключ перевыпускается; паритет в гейте на MinIO", adr: ADR-0006}
  - {id: NFR-STAND, title: "Стенд одной командой docker compose из образов по sha: postgres, S3 (MinIO для паритета или Yandex Object Storage), ml, api, web; healthcheck у каждого сервиса, зависимые стартуют после healthy; рантайм без root и пакетного менеджера, код только для чтения; hadolint в гейте"}
  - {id: NFR-QA-ECHELONS, title: "Тесты размечены эшелонами qa-standard L1–L8 во всех модулях (api, ml, web, scripts); каждый эшелон L1–L7 закрыт; мутационный скор новых модулей ≥ 70 %; QA-отчёт по шаблону qa-report с sha"}
  - {id: NFR-RESILIENCE, title: "Стенд не падает и не перегревает мак под разбором: OCR страниц параллельно в пределах бюджета пикселей (INSPECTOR_OCR_BUDGET_MPX), лимиты памяти и CPU у ML, рубильник load-guard (CPU ≥ 95 °C, память < 10 %, своп > 6 ГБ → пауза ML), тяжёлые прогоны — через heavy.sh с порогом температуры"}
  - {id: NFR-ML-HOST, title: "Стенд на маке работает с ML на самом маке (MLX, Metal): сервис ML вне Docker по HTTPS TLS 1.3 с сертификатом CA стенда, модели по одной на процесс (читатели — отдельными этапами), потолок памяти MLX; рубильник замораживает нативный процесс ML и всё дерево процессов замка heavy.sh (Stryker, mutmut, тесты) по CPU/GPU °C, памяти и росту свопа; heavy.sh без рубильника не стартует; сборки стенда чистятся автоматически (две последние, кэш сборки ≤ 5 ГБ)"}
  - {id: NFR-MODEL-REGISTRY, title: "Модель каждой ML-роли выбирается по реестру ml/models.yaml: замер ≥ 2 кандидатов на ручной разметке, только открытые веса и локальный запуск; гейт падает, если модель в коде ≠ выбранной или проверка версий старше 14 дней"}
  - {id: NFR-DEMO-READONLY, title: "Демо-стенд только для просмотра: при INSPECTOR_READONLY=1 любой изменяющий запрос API — 403 с объяснением до обработчика и базы (чтение открыто, из изменяющих — только вход и выход), вход гостевой — только с явно заданной учёткой гостя и не больше 10 входов с адреса за 15 мин, адрес клиента — из X-Forwarded-For только от своих прокси (перебор анонима не закрывает вход остальным); интерфейс помечен плашкой «только просмотр» с происхождением данных; ML, очереди и антивируса на стенде нет", adr: ADR-0006}
  - {id: NFR-DEMO-PUBLISH, title: "Публикация с мака на демо-стенд: данные стенда мака — дампом только данных в схему, созданную той же службой миграций (набор миграций сверяется до восстановления), файлы — чтением из Object Storage без записи; материалы (карта ГЕРЫ, методика, подход, результаты) — статикой; publication.json — где и с какой ревизии посчитано, когда опубликовано, SHA-256 дампа"}
  - {id: NFR-DEMO-ACCESS, title: "Демо-стенд закрыт двумя замками: пароль прокси (basic auth Caddy, хеш bcrypt файлом на сервере, не в git) на всё, кроме /api/* и /health, и вход приложения; гостевого входа нет. /api/* без пароля прокси, потому что пароль прокси и Bearer-токен приложения идут в одном заголовке Authorization, а API без входа отвечает 401. Допущение (метод ГЕРЫ НФТ не даёт): ФИО и подписи в документах реальных объектов остаются за двумя замками, обезличивание — отдельным решением владельца (T-152, OWASP T-140 E2-H2)"}
  - {id: NFR-DEMO-CONTENT, title: "На демо-стенде — результаты, посчитанные стендом мака на той же ревизии main, что и код демо: publication.json хранит ревизию расчёта, scripts/demo.sh status сверяет её с ревизией API и предупреждает о расхождении (T-152)"}
  - {id: NFR-IDS, title: "IDS и защита от DDoS: лимит запросов и соединений на адрес клиента (nginx и API), обнаружение перебора, сканирования и сигнатур атак с блокировкой адреса, событием безопасности и уведомлением администратора; адрес клиента берётся только от доверенного прокси (T-138, T-090)", mode: prod}
  - {id: NFR-PERF-RUNTIME, title: "Пределы §11 под наблюдением в эксплуатации: время ML-анализа параметра, CV-анализа листа и доставки протокола в «РиН» — в метриках Prometheus, алерт при превышении 500 мс, 30 с, 30 с (T-138)", mode: prod}
  - {id: NFR-UKEP, title: "Каждый запрос к внешней ИС («РиН») подписан УКЭП: откреплённая CMS над канонической строкой запроса, метка времени ±300 с и nonce; провайдеры PEM, openssl-gost, КриптоПро; без подписанта в профиле gpu API не стартует (T-137)", mode: prod}
  - {id: NFR-MTLS, title: "Аутентификация в ИАИС «РиН» клиентским сертификатом (mTLS, УКЭП)", mode: prod}
  - {id: NFR-VERIFY-30, title: "Полный цикл верификации протокола ≤ 30 минут у опытного инспектора; юзабилити-тест на 5 инспекторах", mode: prod}
  - {id: NFR-AV, title: "Антивирусная проверка файлов перед сохранением", mode: prod}
  - {id: NFR-LOGS, title: "Структурированные JSON-логи: timestamp, level, service, message, request_id, user_id"}
  - {id: NFR-METRICS, title: "Метрики Prometheus: CPU/RAM, диск, RPS, латентность, 5xx, очередь, сессии"}
  - {id: NFR-METRICS-STORE, title: "Раз в минуту снимок метрик в monitoring_metrics (metric_name, value, timestamp, service_name, tags), хранение 90 дней, ряд по имени и интервалу — администратору"}
  - {id: NFR-OBS-STACK, title: "Prometheus + Grafana, ELK, алерты на почту и в Telegram", mode: prod}
  - {id: NFR-QUALITY, title: "Приёмка: Precision ≥ 0,90, Recall ≥ 0,80, F1 ≥ 0,85, FPR ≤ 0,10, IoU ≥ 0,5", mode: gpu}
  - {id: NFR-C01, title: "Корпус corpus-ABC не попадает в репозиторий и демо; демо — синтетика", adr: ADR-0002}

