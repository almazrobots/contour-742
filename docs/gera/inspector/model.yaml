  - {id: GAP-INSP-01, kind: owner, status: open, title: "Нет живого респондента-инспектора: обследование по документам организатора"}
  - {id: GAP-INSP-02, kind: owner, status: closed, title: "Приложение № 2 (образец протокола) получено в пакете участника (SRC-INSP-08); протокол выровнен по нему — OS-INSP-5.1.6, семь разделов образца (T-121, закрыто аудитом T-164)"}
  - {id: GAP-INSP-04, kind: owner, status: open, title: "XLSX и изображения принимаются кодом, но расширение перечня форматов ТЗ требует согласования; XLS проверяется отдельно"}
  - {id: GAP-INSP-05, kind: owner, status: closed, title: "Скан общего журнала работ и тома ИД больше 50 МБ — предел ТЗ отклонил бы обязательный документ. Закрыт: решение владельца 28.09 — серверный импорт (Q&A 16.09 № 9: 50 и 200 МБ — пределы интерактивной загрузки), OS-INSP-1.2.36–1.2.43, T-169"}
  - {id: GAP-INSP-06, kind: owner, status: open, title: "ТЗ §2, акт №13: расхождение наименования и реквизитов; нужна согласованная редакция источника"}
  - {id: GAP-INSP-07, kind: owner, status: closed, title: "М-072: реализована шкала давления PN/Ру/бар (OS-INSP-3.1.25, T-135). Снижение класса — CANDIDATE; неизвестный класс — NOT_COMPARABLE"}
  - {id: GAP-INSP-03, kind: to-be, status: open, title: "Не подтверждена приёмка метрик §14.3 на установленной выборке; измерители и исторические прогоны не закрывают целевые пороги"}
  # Находки детальной трассы (T-097): строки ТЗ, которые не разложены в атомы, и расхождение ТЗ с Матрицей
  - {id: GAP-INSP-08, kind: owner, status: open, title: "Разделы ПД: §3 ТЗ (13 разделов по ПП № 87) расходится с §6 ТЗ и Матрицей (12 разделов). ТХ, БЭ, ИН без параметров; ПОД (снос) и ЗУ (энергоэффективность) в §3 не названы"}
  - {id: GAP-INSP-09, kind: owner, status: open, title: "ТЗ §3, примечание: у линейных объектов другой перечень разделов (п. 3² Положения). Система тип объекта не различает — поддерживать ли линейные объекты?"}
  - {id: GAP-INSP-10, kind: owner, status: open, title: "ТЗ §3, примечание: для бюджетных объектов разделы 6, 11, 5 и 9 обязательны. Проверять ли комплектность с учётом источника финансирования?"}
  - {id: GAP-INSP-11, kind: owner, status: open, title: "ТЗ §9.2: «сопоставление значений и геометрии» — есть измерение на одном чертеже (9.1.3) и сравнение двух листов между редакциями с ручным выбором пары (OS-INSP-3.4); автоматического сопоставления геометрии между стадиями ПД, РД и ИД нет — нужно ли оно?"}
  - {id: GAP-INSP-12, kind: owner, status: open, title: "ТЗ §9.4: состав релиза обучающей выборки «определяется покрытием целевых категорий», но критерий достаточного покрытия не задан"}
  - {id: GAP-INSP-13, kind: owner, status: open, title: "Редакция ТЗ: в пакете участника — версия 1.0 от 15.07.2026 (4 829 слов); трасса построена по PDF от 12.09 (5 795 слов, 32 стр.) — это более поздний текст. Тождество с «01_ТЗ_существенная_редакция_1.1.docx» (Q&A О-4) не доказано. Матрица 1.1 и Приложение 1 пакета совпадают по 132 параметрам и логике"}
  - {id: GAP-INSP-14, kind: owner, status: open, title: "ТЗ §2: замечания к реквизитам и редакциям нормативных актов не разрешены согласованной редакцией источника"}

