        title: "Шифрование"
        atoms:
          - {id: TZA-12.3-01, t: "Данные в покое (БД, файловое хранилище) зашифрованы", kind: S, method: I, accept: "Шифрование томов и БД", trace: [NFR-CRYPTO], scope: prod, note: "29.09 на новом GPU/CPU-кандидате доказаны S3 AES-256-GCM и зашифрованный локальный кэш IBE1 после cache miss. Шифрование тома PostgreSQL и подключение шифрованного WAL/backup нового кандидата не доказаны. Проверки LUKS и CMS существуют в legacy deploy/gpu, их наличие не закрывает текущую поставку (docs/qa/platform-release-20260929.md; T-170)", partial: true}
          - {id: TZA-12.3-02, t: "Данные при передаче — TLS 1.3", kind: S, method: T, accept: "TLS 1.3 на входе", trace: [NFR-TLS], scope: prod}
      - id: TZ-12.4
        title: "Журнал аудита"
        atoms:
          - {id: TZA-12.4-01, t: "Каждое действие фиксируется со временем, IP-адресом, типом действия и идентификатором объекта", kind: S, method: T, accept: "Запись со всеми полями", trace: [OS-INSP-8.2.1]}
      - id: TZ-12.5
        title: "Сроки хранения логов"
        atoms:
          - {id: TZA-12.5-01, t: "Не менее 90 дней для штатных операций, не менее 1 года для событий безопасности", kind: O, method: I, accept: "Политика хранения логов", trace: [NFR-LOGRET], scope: prod}
      - id: TZ-12.6
        title: "Персональные данные"
        atoms:
          - {id: TZA-12.6-01, t: "ПДн (ФИО инспектора, контакты застройщика) обрабатываются по 152-ФЗ", kind: S, method: A, accept: "Модель угроз и меры по 152-ФЗ", trace: [NFR-PDN, NFR-OBJSTORE], scope: prod, note: "Реестр ПДн с гейтом на миграции, маскирование в логах, API и «РиН» (без ФИО), обезличивание учёток через 30 дней после выключения и IP/UA аудита через 365 дней, сведения субъекту с аудитом доступа, S3 только в РФ (T-137, docs/security/PDN-REGISTRY.md). Основания обработки — допущение, подтверждает юрист оператора"}
      - id: TZ-12.7
        title: "Целостность данных (187-ФЗ)"
        atoms:
          - {id: TZA-12.7-01, t: "Обеспечение целостности данных в части 187-ФЗ", kind: S, method: T, accept: "Контроль целостности хранилища", trace: [NFR-INTEGRITY]}
      - id: TZ-12.8
        title: "Резервное копирование"
        atoms:
          - {id: TZA-12.8-01, t: "Ежедневный бэкап БД и файлового хранилища, хранение 30 дней", kind: O, method: T, accept: "Бэкап и проверенное восстановление", trace: [NFR-BACKUP, NFR-OBJSTORE, NFR-RECOVERY], scope: prod, note: "Цель бэкапа — бакет S3 (ADR-0004, T-108): базовый бэкап + WAL-архив, версионирование и object lock; восстановление проверяется в гейте (T-072); Аудит T-164 (Д-052): бэкап файлового хранилища не настроен — compose.backup-s3.yml копирует только базовый бэкап и WAL, блобы S3 не резервируются", partial: true}
      - id: TZ-12.9
        title: "Защита от НСД"
        atoms:
          - {id: TZA-12.9-01, t: "Система обнаружения вторжений (IDS)", kind: S, method: I, accept: "IDS в контуре", trace: [NFR-IDS], scope: prod, note: "код готов, проверка на стенде; детектор атак и блокировки в API (T-138)"}
          - {id: TZA-12.9-02, t: "Защита от DDoS-атак", kind: S, method: I, accept: "Защита на периметре", trace: [NFR-IDS], scope: prod, note: "код готов, проверка на стенде; limit_req/limit_conn nginx + лимит на адрес в API (T-138)"}
      - id: TZ-12.10
        title: "Подписание запросов к ИАИС «РиН»"
        atoms:
          - {id: TZA-12.10-01, t: "Все запросы к внешним системам подписываются УКЭП", kind: S, method: T, accept: "Подпись запроса", trace: [NFR-UKEP], scope: prod, note: "Каждый запрос к «РиН» (протокол, автозабор) подписан откреплённой CMS над канонической строкой (метка ±300 с, nonce); провайдеры PEM, openssl-gost (проверен в docker с gost-engine), КриптоПро (cryptcp; без лицензии СКЗИ проверен поддельным бинарником); без подписанта gpu не стартует (T-137); Аудит T-164 (Д-053): запросы в S3 (Yandex Object Storage) УКЭП не подписываются — выведены белым списком (ukep-signing.test.ts)", partial: true}
      - id: TZ-12.11
        title: "Антивирусная защита"
        atoms:
          - {id: TZA-12.11-01, t: "Все загружаемые файлы проходят антивирусную проверку до сохранения", kind: S, method: T, accept: "Заражённый файл отклоняется", trace: [NFR-AV], scope: prod}

  # ─────────────────────────────────────────────── 13. Мониторинг
  - id: S13
    title: "Требования к мониторингу и логированию"
    items:
      - id: TZ-13.1
        title: "Формат логов"
        atoms:
          - {id: TZA-13.1-01, t: "Логи — JSON с полями timestamp, level, service, message, request_id, user_id", kind: O, method: T, accept: "Строка лога содержит поля", trace: [NFR-LOGS]}
      - id: TZ-13.2
        title: "Уровни логирования"
        atoms:
          - {id: TZA-13.2-01, t: "INFO — штатные операции; WARNING — некритичные; ERROR — сбои", kind: O, method: I, accept: "Уровни используются по назначению", trace: [NFR-LOGS, NFR-LOGRET]}
          - {id: TZA-13.2-02, t: "DEBUG включается только в тестовом контуре", kind: O, method: T, accept: "DEBUG выключен по умолчанию", trace: [NFR-LOGS]}
      - id: TZ-13.3
        title: "Сроки хранения логов"
        atoms:
          - {id: TZA-13.3-01, t: "90 дней для INFO и выше; 1 год для ERROR и WARNING по безопасности", kind: O, method: I, accept: "Политика хранения", trace: [NFR-LOGRET], scope: prod}
      - id: TZ-13.4
        title: "Метрики мониторинга"
        atoms:
          - {id: TZA-13.4-01, t: "CPU и RAM по каждому сервису", kind: O, method: T, accept: "Метрики процесса", trace: [NFR-METRICS]}
          - {id: TZA-13.4-02, t: "Использование дискового пространства", kind: O, method: T, accept: "Метрика диска", trace: [NFR-METRICS-STORE], note: "disk_free_bytes и disk_used_percent в monitoring_metrics каждую минуту (T-101); алерт по диску — стенд"}
          - {id: TZA-13.4-03, t: "RPS, среднее время ответа, число ошибок 5xx", kind: O, method: T, accept: "Метрики HTTP", trace: [NFR-METRICS]}
          - {id: TZA-13.4-04, t: "Размер очереди сообщений (RabbitMQ)", kind: O, method: T, accept: "Метрика очереди", trace: [NFR-METRICS]}
          - {id: TZA-13.4-05, t: "Количество активных сессий", kind: O, method: T, accept: "Метрика сессий", trace: [NFR-METRICS]}
      - id: TZ-13.5
        title: "Prometheus и Grafana"
        atoms:
          - {id: TZA-13.5-01, t: "Интеграция с Prometheus и дашборды Grafana", kind: O, method: D, accept: "Дашборд в Grafana", trace: [NFR-OBS-STACK], scope: prod}
      - id: TZ-13.6
        title: "ELK"
        atoms:
          - {id: TZA-13.6-01, t: "Централизованное хранение и поиск логов в ELK", kind: O, method: D, accept: "Логи в Kibana", trace: [NFR-OBS-STACK], scope: prod}
      - id: TZ-13.7
        title: "Алертинг"
        atoms:
          - {id: TZA-13.7-01, t: "Алерты при превышении порогов (CPU > 80 %, ответ > 500 мс)", kind: O, method: T, accept: "Алерт срабатывает", trace: [NFR-OBS-STACK], scope: prod}
          - {id: TZA-13.7-02, t: "Уведомления администратору по почте и в Telegram", kind: O, method: T, accept: "Сообщение доставлено", trace: [NFR-OBS-STACK], scope: prod}
      - id: TZ-13.8
        title: "Проверка целостности"
        atoms:
          - {id: TZA-13.8-01, t: "Ежедневная проверка контрольных сумм файлов хранилища", kind: O, method: T, accept: "Подмена файла обнаруживается", trace: [NFR-INTEGRITY], note: "Хранилище файлов — S3 (ADR-0006) с кэш-томом; ежедневная сверка хешей распространяется на объекты S3 (services/integrity.ts, ветка store.kind === s3)"}

  # ─────────────────────────────────────────────── 14. Приёмка качества
  - id: S14
    title: "Приёмка качества и эталонный набор"
    items:
      - id: TZ-14.1
        title: "Единица разметки и GOLD"
        atoms:
          - {id: TZA-14.1-01, t: "Единица разметки — evidence_group: объект, параметр, актуальные редакции, фрагменты с координатами", kind: D, method: I, accept: "Элемент набора ссылается на evidence_group", trace: [OS-INSP-6.1.1, DO-DATASET]}
          - {id: TZA-14.1-02, t: "Положительная метка — только CONFIRMED_VIOLATION, отрицательная — NEGATIVE_VERIFIED", kind: D, method: T, accept: "Метки по статусам", trace: [OS-INSP-6.1.1]}
          - {id: TZA-14.1-03, t: "Для метки сохраняются решение эксперта, причина, дата, версии источников", kind: D, method: I, accept: "Поля элемента набора", trace: [DO-DATASET]}
      - id: TZ-14.2
        title: "Правила выборок"
        atoms:
          - {id: TZA-14.2-01, t: "Train, validation и hidden test разделяются по object_id", kind: D, method: T, accept: "Изоляция объектов", trace: [OS-INSP-6.1.2]}
          - {id: TZA-14.2-02, t: "Состав hidden test и SHA-256 фиксируются организатором", kind: C, method: A, accept: "Хеш теста зафиксирован", trace: [OS-INSP-6.1.3, OS-INSP-6.1.4, OS-INSP-6.1.5], scope: gpu}
          - {id: TZA-14.2-03, t: "В тесте — подтверждённые нарушения, отрицательные, MISSING_EVIDENCE, неприменимые, конфликт редакций", kind: C, method: A, accept: "Состав классов теста", trace: [OS-INSP-6.5.13, OS-INSP-6.5.14, OS-INSP-6.5.15], scope: gpu}
          - {id: TZA-14.2-04, t: "Метки hidden test не передаются; подбор порога по нему запрещён", kind: C, method: A, accept: "Процедура", trace: [OS-INSP-6.1.6, OS-INSP-6.1.7, OS-INSP-6.1.9], scope: gpu, note: "Метки не принимаются конвейером (HIDDEN_TEST_LABELS); балл — только по ответу из журнала печати; подбор порога при пересечении validation со скрытым тестом отклоняется (T-137)"}
          - {id: TZA-14.2-05, t: "Каждый результат содержит dataset_version, matrix_version, model_version, input_manifest_hash", kind: D, method: T, accept: "Версии в протоколе", trace: [OS-INSP-3.3.1]}
      - id: TZ-14.3
        title: "Приёмочные метрики"
        atoms:
          - {id: TZA-14.3-01, t: "OCR: Character Accuracy = 1 − ΣLevenshtein / Σ символов ≥ 0,95 (микросреднее); публикуются CER, WER, coverage", kind: A, method: T, accept: "Замер на hidden test", trace: [NFR-OCR-Q, OS-INSP-6.5.18, OS-INSP-6.5.1], scope: gpu}
          - {id: TZA-14.3-02, t: "Ключевые поля (шифр, стадия, редакция, лист/страница, номер помещения/элемента) после нормализации: Exact Match ≥ 0,90", kind: A, method: T, accept: "Замер", trace: [NFR-OCR-Q, OS-INSP-6.5.18, OS-INSP-6.5.1], scope: gpu, note: "стенд OCR (T-138): EM 0,855 [0,806; 0,900] — НЕ пройден; шифр 0,76, номер помещения 0,61; доработка — T-151; docs/qa/OCR-9.1.1.md"}
          - {id: TZA-14.3-03, t: "Связка документов: доля групп с точным выбором object_id, стадии, шифра, редакции ≥ 0,95", kind: A, method: T, accept: "Замер", trace: [NFR-QUALITY, OS-INSP-6.5.1, OS-INSP-6.5.3], scope: gpu}
          - {id: TZA-14.3-04, t: "Локализация: file_id и страница точно, bbox/polygon IoU ≥ 0,50 после нормализации геометрии — ≥ 0,95 групп с полным комплектом доказательств", kind: A, method: T, accept: "Замер", trace: [NFR-QUALITY, OS-INSP-6.5.1, OS-INSP-6.5.3], scope: gpu}
          - {id: TZA-14.3-05, t: "Выявление нарушений: Precision ≥ 0,90, Recall ≥ 0,80, F1 ≥ 0,85 по evidence_group; совпадение — при верном параметре или типе расхождения и корректном доказательстве", kind: A, method: T, accept: "Замер", trace: [NFR-QUALITY, OS-INSP-6.5.1, OS-INSP-6.5.3], scope: gpu}
          - {id: TZA-14.3-06, t: "FPR на NEGATIVE_VERIFIED и устаревших редакциях ≤ 0,10", kind: A, method: T, accept: "Замер", trace: [NFR-QUALITY, OS-INSP-6.5.1, OS-INSP-6.5.3], scope: gpu}
          - {id: TZA-14.3-07, t: "Метрики на hidden test публикуются по объектам, разделам, типам нарушений с размером выборки, coverage/abstention и 95 % ДИ", kind: A, method: A, accept: "Отчёт приёмки", trace: [OS-INSP-6.5.10], scope: gpu}
          - {id: TZA-14.3-08, t: "Недостижение любого обязательного порога — система не принята, даже при сводной F1 выше порога", kind: A, method: A, accept: "Правило приёмки", trace: [OS-INSP-6.5.3], scope: gpu}
