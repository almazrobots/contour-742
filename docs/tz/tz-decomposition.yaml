# Атомарная декомпозиция ТЗ «Инспектор ИИ» (Мосстройнадзор, 31 с.) — основа приёмки.
# Этажи: Т1 раздел → Т2 пункт (id совпадают с model.yaml → tz, новые помечены new: true) → Т3 атом.
# Атом — одно проверяемое утверждение ТЗ. Поля атома:
#   t       — требование, близко к тексту ТЗ
#   kind    — F функциональное · D данные · I интерфейс/API · Q качество/производительность · S безопасность ·
#             O эксплуатация/мониторинг · C ограничение/норматив · A приёмочная метрика
#   method  — метод приёмки: I осмотр документации/кода · A анализ · D демонстрация · T испытание (автотест)
#   accept  — критерий приёмки: что должно наблюдаться
#   trace   — чем реализовано (правила OS-INSP-*, НФТ NFR-*, диалоги DLG-*, данные DO-*); пусто — не реализовано
#   scope   — prototype (по умолчанию) · gpu (проверяется на GPU-стенде) · prod (эксплуатационный контур)
# partial: true — реализация есть, но с оговоркой из note: вердикт не выше «частично».
# Вердикт атома вычисляется `pnpm trace` по статусам trace; руками не пишется. Вне прототипа (gpu/prod) —
# всегда «вне прототипа»; ready: код для проверки на стенде уже есть.

schema: tz-atoms/1
source: {id: SRC-INSP-01, title: "ИИ-сервис отслеживания и анализа изменений между стадиями проектирования, а также контроля исполнительной документации", pages: 31, file: "ТЗ/10. Мосстройнадзор.pdf"}

sections:
  # ─────────────────────────────────────────────── 1. Общие положения
  - id: S1
    title: "Общие положения"
    items:
      - id: TZ-1.1
        new: true
        find: "Интеллектуальный сервис для автоматической"
        title: "Наименование сервиса"
        atoms:
          - {id: TZA-1.1-01, t: "Сервис именуется «Инспектор ИИ» (краткое наименование для интерфейса)", kind: I, method: I, accept: "Название «Инспектор ИИ» в заголовке интерфейса и на экране входа", trace: [DLG-INSP-01]}
      - id: TZ-1.2
        title: "Назначение: функции системы"
        atoms:
          - {id: TZA-1.2-01, t: "Выявлять нарушения и несоответствия между ПД, РД и ИД по 132 контролируемым параметрам", kind: F, method: T, accept: "На синтетическом пакете FULL найдены все заложенные расхождения; параметров в протоколе 132", trace: [OS-INSP-3.1.5, OS-INSP-3.1.6, OS-INSP-7.1.1, OS-INSP-3.1.25], partial: true, note: "Проверено на всех 132 параметрах (фабрика v3, 638 групп): P/R 0,992. M-072 закрыт шкалой класса давления PN (GAP-INSP-07, OS-INSP-3.1.25, T-135). На реальных данных не измерено: в корпусе только ИД, разметка ссылается на отсутствующие файлы ALT79B-* (docs/qa/CORPUS-RUN.md)."}
          - {id: TZA-1.2-02, t: "Инспектор верифицирует выявленные нарушения с фиксацией решения и обоснования", kind: F, method: T, accept: "Решение по кандидату сохраняется с пользователем, временем, причиной и комментарием", trace: [OS-INSP-4.1.2, OS-INSP-4.1.3, OS-INSP-4.1.4]}
          - {id: TZA-1.2-03, t: "Программный API для обмена документами и результатами проверок с внешними ИС, целевая — ИАИС «РиН»", kind: I, method: T, accept: "Документированный REST API; приём пакетов документов из внешней системы и передача финализированного протокола", trace: [NFR-API, OS-INSP-1.2.15, OS-INSP-5.2.1]}
          - {id: TZA-1.2-04, t: "Автоматический контроль наличия документов", kind: F, method: T, accept: "Статусы загрузки стадий и перечень недостающих файлов по реестру", trace: [OS-INSP-1.4.1, OS-INSP-1.4.3, OS-INSP-1.2.35]}
          - {id: TZA-1.2-05, t: "Инкрементальная дозагрузка файлов до финализации протокола", kind: F, method: T, accept: "Дозагрузка в открытую проверку пересчитывает затронутые параметры; после финализации отклоняется", trace: [OS-INSP-1.2.7, OS-INSP-1.2.8, OS-INSP-3.3.4]}
      - id: TZ-1.3
        title: "Тип взаимодействия: REST over HTTPS, JSON, OpenAPI 3.0"
        atoms:
          - {id: TZA-1.3-01, t: "Запросы и ответы передаются в JSON по REST", kind: I, method: T, accept: "Эндпоинты API принимают и возвращают application/json", trace: [NFR-API-JSON]}
          - {id: TZA-1.3-02, t: "Обязательная валидация схемы OpenAPI 3.0", kind: I, method: T, accept: "Спецификация OpenAPI 3.0 опубликована; входные данные валидируются по схеме", trace: [NFR-API, NFR-API-VALIDATE]}
          - {id: TZA-1.3-03, t: "Транспорт — HTTPS", kind: S, method: I, accept: "API доступен только по HTTPS (TLS 1.3) в эксплуатационном контуре", trace: [NFR-TLS, NFR-TLS-INTERNAL], scope: prod}
      - id: TZ-1.4
        title: "Асинхронная pull-модель"
        atoms:
          - {id: TZA-1.4-01, t: "После загрузки документов система возвращает идентификатор процесса process_id", kind: I, method: T, accept: "POST загрузки отвечает 202 с process_id", trace: [NFR-ASYNC]}
          - {id: TZA-1.4-02, t: "Результат проверки формируется асинхронно и доступен по запросу", kind: I, method: T, accept: "Протокол забирается GET по process_id после завершения обработки", trace: [NFR-ASYNC, OS-INSP-3.3.3]}
          - {id: TZA-1.4-03, t: "Статус обработки отслеживается через эндпоинт мониторинга", kind: I, method: T, accept: "GET статуса возвращает статус процесса, сценарий и статусы загрузки", trace: [NFR-ASYNC]}
      - id: TZ-1.5
        title: "Платформа"
        atoms:
          - {id: TZA-1.5-01, t: "Веб-приложение с интерфейсом загрузки документов и получения результатов анализа", kind: I, method: D, accept: "Экраны загрузки и протокола доступны в браузере", trace: [DLG-INSP-03, DLG-INSP-04]}
          - {id: TZA-1.5-02, t: "Клиентская часть на React", kind: C, method: I, accept: "Фронтенд собран на React", trace: [NFR-STACK]}
          - {id: TZA-1.5-03, t: "Серверная часть на Node.js", kind: C, method: I, accept: "API работает на Node.js", trace: [NFR-STACK]}
          - {id: TZA-1.5-04, t: "ML-модули на Python версии 3.11 и выше", kind: C, method: I, accept: "ML-модуль на Python ≥ 3.11", trace: [NFR-STACK]}
          - {id: TZA-1.5-05, t: "Модули взаимодействуют через REST API и асинхронную очередь сообщений RabbitMQ", kind: C, method: I, accept: "Задания разбора идут через RabbitMQ", trace: [NFR-STACK], scope: prod, note: "Живой GPU-кандидат проверен29.09: RabbitMQ/AMQPS, durable coordinator и ML/HTTPS; свежий S3-процесс прошёл4документа до финализации и4экспортов (docs/qa/platform-release-20260929.md). Публичное переключение ещё не выполнено; unit fake-channel не является стендовой проверкой"}

  # ─────────────────────────────────────────────── 2. Нормативная база
  - id: S2
    title: "Нормативная база"
    items:
      - id: TZ-2
        title: "Нормативные акты (13) и статьи ГрК РФ"
        atoms:
          - {id: TZA-2-01, t: "Система учитывает перечень из 13 нормативных актов в редакциях на июль 2026 года", kind: C, method: I, accept: "Нормативная база содержит акты раздела 2 с реквизитами и сроком действия", trace: [OS-INSP-7.2.1, OS-INSP-7.2.2, DO-LEGAL-ACT], note: "13 актов по тексту ТЗ; у 5 (№ 7, 8, 9, 11, 12) редакция в ТЗ не указана; по акту № 13 расхождение реквизитов — GAP-INSP-06; реквизиты ПП № 2078, № 87, № 2161 и 397-ПП расходятся с первоисточниками — GAP-INSP-14"}
          - {id: TZA-2-02, t: "Нормативные документы ведутся со сроками действия и деактивируются, а не удаляются", kind: D, method: T, accept: "Норматив можно деактивировать с датой окончания; запись сохраняется", trace: [OS-INSP-7.2.1]}

  # ─────────────────────────────────────────────── 3–6. Состав документации и Матрицы
  - id: S3
    title: "Разделы проектной документации (ПП РФ № 87)"
    items:
      - id: TZ-3
        title: "13 разделов ПД и подразделы ИОС1–5"
        atoms:
          - {id: TZA-3-01, t: "Матрица охватывает разделы ПД: ПЗ, СПЗУ, АР, КР, ИОС1–5, ТХ, ПОС, ООС, ППМ, БЭ, ОДИ, СМ, ИН", kind: D, method: I, accept: "Параметры Матрицы размечены разделами ПД", trace: [OS-INSP-2.2.21, DO-PARAM], note: "В Матрице ред. 1.1 нет параметров ТХ, БЭ, ИН (GAP-INSP-08) — эти разделы ПД не сверяются", partial: true}
          - {id: TZA-3-02, t: "Подразделы ИОС: ИОС1 ЭОМ, ИОС2/3 ВК, ИОС4 ОВ, ИОС5 СС", kind: D, method: I, accept: "Параметры ИОС размечены подразделами", trace: [OS-INSP-2.2.21, DO-PARAM]}
  - id: S4
    title: "Состав рабочей документации"
    items:
      - id: TZ-4
        title: "Компоненты РД по ГОСТ Р 21.101-2020"
        atoms:
          - {id: TZA-4-01, t: "Принимаются основные комплекты рабочих чертежей по маркам (АР, КЖ, КМ, ЭОМ, ВК, ОВ, СС и др.)", kind: D, method: T, accept: "Реестр принимает марку комплекта в поле discipline", trace: [OS-INSP-2.2.21, OS-INSP-1.2.24, DO-FILE]}
          - {id: TZA-4-02, t: "Учитываются спецификации (ГОСТ 21.110), ведомости, общие данные, сметы, опросные листы и габаритные чертежи (данные для заказа оборудования), расчёты, прилагаемые документы", kind: D, method: I, accept: "Виды документов РД различимы; смета и опросный лист не становятся источником значения параметра", trace: [DO-MANIFEST, OS-INSP-2.2.7], note: "«Прилагаемые документы» отдельным видом не выделяются — попадают в «прочий документ»; Аудит T-164 (Д-067, Д-068): габаритные чертежи ГЧ классификатор относит к чертежу — источнику значения; расчёты ТЗ «как правило, не включает» в РД, а система считает их источником значения (вопрос владельцу — T-170)", partial: true}
  - id: S5
    title: "Состав исполнительной документации (Приказ Минстроя № 344/пр)"
    items:
      - id: TZ-5
        title: "13 видов ИД"
        atoms:
          - {id: TZA-5-01, t: "Принимаются 13 видов ИД: акты геодезической основы, разбивки осей, АОСР, освидетельствования конструкций и сетей, замечания заказчика, рабочие чертежи с отметками, исполнительные схемы, акты испытаний, результаты экспертиз, документы качества, журналы работ", kind: D, method: T, accept: "Пакет ИД с реестром принимается, стадия ID учитывается в комплектности", trace: [OS-INSP-1.4.1, DO-FILE]}
      - id: TZ-5.N1
        new: true
        find: "Ведение исполнительной документации допускается"
        title: "Электронная ИД с УКЭП / УНЭП"
        atoms:
          - {id: TZA-5.N1-01, t: "Электронная ИД принимается без бумажного дубля при подписании УКЭП или УНЭП", kind: C, method: T, accept: "Подпись электронного документа проверяется и отражается в реестре", trace: [OS-INSP-1.2.11, OS-INSP-1.2.12, OS-INSP-1.2.13, OS-INSP-1.2.14], scope: prod, note: "RSA/ECDSA проверяются в процессе; ГОСТ Р 34.10-2012 — только через сертифицированное СКЗИ (лицензия, T-068), без него UNVERIFIED; отзыв сертификата (CRL/OCSP) и доверенная метка времени — на стенде"}
      - id: TZ-5.N2
        title: "Сканы: визуальная проверка реквизитов"
        atoms:
          - {id: TZA-5.N2-01, t: "Допускается загрузка отсканированных копий (PDF) без ЭП", kind: F, method: T, accept: "Скан без текстового слоя принимается и разбирается OCR", trace: [OS-INSP-2.1.1]}
          - {id: TZA-5.N2-02, t: "Для сканов система визуально проверяет наличие подписей, печатей, дат, регистрационных номеров", kind: F, method: T, accept: "По каждому скану — отметки наличия подписи, печати, даты, номера", trace: [OS-INSP-2.3.1, OS-INSP-2.3.2, OS-INSP-2.3.4], note: "Аудит T-164 (Д-001): находкой становится только отсутствие подписи (requisites.ts REQUIRED = [signature]); печать, дата и номер распознаются, но их отсутствие на скане находку не даёт", partial: true}
      - id: TZ-5.N3
        new: true
        find: "Комплект рабочих чертежей является основной"
        title: "Штампы на рабочих чертежах"
        atoms:
          - {id: TZA-5.N3-01, t: "Рабочие чертежи в составе ИД содержат штампы «В производство работ» и «Выполнено согласно проекту»", kind: F, method: T, accept: "Отсутствие штампа выявляется как находка", trace: [OS-INSP-2.3.1, OS-INSP-2.3.3]}
      - id: TZ-5.N4
        new: true
        find: "Перечень скрытых работ, строительных конструкций"
        title: "Перечень скрытых работ из Общих данных"
        atoms:
          - {id: TZA-5.N4-01, t: "Перечень скрытых работ и конструкций, подлежащих освидетельствованию, берётся из Общих данных ПД", kind: F, method: T, accept: "Каждой позиции перечня соответствует АОСР или находка MISSING_EVIDENCE", trace: [OS-INSP-1.4.4]}
  - id: S6
    title: "Соответствие разделов Матрицы составу документации"
    items:
      - id: TZ-6
        title: "Раздел Матрицы ↔ раздел ПД ↔ компонент РД ↔ документ ИД"
        atoms:
          - {id: TZA-6-01, t: "Для каждого раздела Матрицы определены соответствующие раздел ПД, компонент РД и документ ИД (12 строк таблицы)", kind: D, method: I, accept: "У параметра заданы источники ПД, РД, ИД", trace: [OS-INSP-2.2.4, DO-PARAM]}

  # ─────────────────────────────────────────────── 7. Состав системы (модули)
  - id: S7
    title: "Состав системы — 12 модулей"
    items:
      - id: TZ-7.1
        title: "Модуль 1. Загрузка и парсинг документов · High"
        atoms:
          - {id: TZA-7.1-01, t: "Загрузка ПД, РД, ИД в форматах PDF, DOCX, XML", kind: F, method: T, accept: "Три формата принимаются, прочие отклоняются", trace: [OS-INSP-1.2.1], prio: High}
          - {id: TZA-7.1-02, t: "Извлечение данных по 132 параметрам согласно Матрице", kind: F, method: T, accept: "Значения параметров извлекаются со страницей и bbox", trace: [OS-INSP-2.1.1, OS-INSP-2.2.1, OS-INSP-2.2.12], prio: High, note: "Стенд §14 v3 (30 объектов, 638 групп, все 132 параметра, текстовые слои и сканы 200–300 dpi): связка и локализация (file+стр.+IoU ≥ 0,5) 1,000 по каждому из 132, Precision/Recall 1,000, FPR 0 — docs/qa/ACCEPTANCE-14.md. Потери OCR на сканах (M-022, M-027, M-120) закрыты перечитыванием значения по типу из Матрицы (2.2.12, ml/inspector_ml/reread.py; мутационный скор — docs/qa/QA-REPORT.md). Ограничение данных, не реализации: размеченной реальной ПД/РД нет; на корпусе ИД (156 файлов) полей Матрицы нет, 78 % OCR-страниц сканов — действительно низкого качества (движки согласны в 6–77 % слов против ≥ 86 % на синтетике), docs/qa/CORPUS-RUN.md."}
          - {id: TZA-7.1-03, t: "Контроль наличия документов и адаптация под сценарий загрузки", kind: F, method: T, accept: "Сценарий FULL…PARTIALLY_LOADED определяется по загруженным стадиям", trace: [OS-INSP-1.4.1, OS-INSP-1.4.2, OS-INSP-1.4.3], prio: High}
      - id: TZ-7.2
        title: "Модуль 2. Сравнение и формирование протокола · High"
        atoms:
          - {id: TZA-7.2-01, t: "Связка актуальных редакций ПД/РД/ИД", kind: F, method: T, accept: "Сравнение идёт только с эталонной редакцией", trace: [OS-INSP-1.3.1], prio: High}
          - {id: TZA-7.2-02, t: "Раздельные статусы комплектности и findings", kind: F, method: T, accept: "Комплектность и кандидаты — разные разделы протокола", trace: [OS-INSP-3.3.2], prio: High}
          - {id: TZA-7.2-03, t: "Обязательные карточки доказательств", kind: F, method: T, accept: "У каждого кандидата есть карточка с источниками", trace: [OS-INSP-4.1.1], prio: High}
          - {id: TZA-7.2-04, t: "Сравнение значений параметров Матрицы между ПД, РД и ИД", kind: F, method: T, accept: "Расхождение сверх порога даёт CANDIDATE, в пределах порога — NEGATIVE_VERIFIED", trace: [OS-INSP-3.1.1, OS-INSP-3.1.5, OS-INSP-3.1.6], prio: High, note: "Добавлен аудитом детальной трассы (T-164): сравнение названо в имени модуля 2, в колонке «Назначение» не раскрыто"}
      - id: TZ-7.3
        title: "Модуль 3. Верификация инспектором · High"
        atoms:
          - {id: TZA-7.3-01, t: "Проверка кандидатов по карточкам доказательств", kind: F, method: D, accept: "Экран верификации показывает карточку и листы", trace: [DLG-INSP-09], prio: High}
          - {id: TZA-7.3-02, t: "Присвоение CONFIRMED_VIOLATION, NEGATIVE_VERIFIED или CLARIFICATION_REQUIRED", kind: F, method: T, accept: "Три решения доступны и сохраняются", trace: [OS-INSP-4.1.2, OS-INSP-4.1.3, OS-INSP-4.1.4, OS-INSP-4.1.23, OS-INSP-4.1.24, OS-INSP-4.1.25], prio: High}
          - {id: TZA-7.3-03, t: "Атомарные решения", kind: F, method: T, accept: "Составной кандидат делится; решение — по каждой части", trace: [OS-INSP-4.2.1], prio: High}
      - id: TZ-7.4
        title: "Модуль 4. Обратная связь и управляемое дообучение · High"
        atoms:
