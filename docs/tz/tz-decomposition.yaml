          - {id: TZA-9.1.7-02, t: "Дозагрузка возможна до финализации протокола", kind: F, method: T, accept: "После финализации дозагрузка отклоняется", trace: [OS-INSP-1.2.8]}
      - id: TZ-9.1.8
        title: "Ошибки при загрузке"
        atoms:
          - {id: TZA-9.1.8-01, t: "Неподдерживаемый формат — отклонение с указанием поддерживаемых форматов", kind: F, method: T, accept: "Сообщение перечисляет PDF, DOCX, XML", trace: [OS-INSP-1.2.1]}
          - {id: TZA-9.1.8-02, t: "Повреждённый PDF — отклонение и уведомление о повторной загрузке", kind: F, method: T, accept: "Сообщение просит загрузить повторно", trace: [OS-INSP-1.2.4]}
          - {id: TZA-9.1.8-03, t: "Файл больше 50 МБ — отклонение с указанием предела", kind: F, method: T, accept: "Сообщение называет 50 МБ", trace: [OS-INSP-1.2.2]}
          - {id: TZA-9.1.8-04, t: "Пакет больше 200 МБ — отклонение пакета с указанием предела", kind: F, method: T, accept: "Сообщение называет 200 МБ", trace: [OS-INSP-1.2.3]}
          - {id: TZA-9.1.8-05, t: "Тайм-аут обработки — повтор до 2 раз, затем уведомление администратора", kind: F, method: T, accept: "Три попытки, затем уведомление admin", trace: [OS-INSP-2.1.4]}
      - id: TZ-9.1.9
        title: "Статусы загрузки документов"
        atoms:
          - {id: TZA-9.1.9-01, t: "Статусы стадий: PD/RD/ID_UPLOADED, _PARTIAL, _MISSING", kind: F, method: T, accept: "Для каждой стадии — один из трёх статусов", trace: [OS-INSP-1.4.1, OS-INSP-1.4.3]}
      - id: TZ-9.1.10
        title: "Статусы процесса проверки"
        atoms:
          - {id: TZA-9.1.10-01, t: "Статусы процесса: PENDING, PARSING, READY, VERIFYING, COMPLETED, FINALIZED", kind: F, method: T, accept: "Процесс проходит статусы по жизненному циклу", trace: [OS-INSP-1.1.2, OS-INSP-3.3.3, OS-INSP-4.3.3]}
          - {id: TZA-9.1.10-02, t: "Дозагрузка разрешена в PENDING, READY, VERIFYING, COMPLETED; запрещена в PARSING и FINALIZED", kind: F, method: T, accept: "Матрица «статус × дозагрузка» соблюдена", trace: [OS-INSP-1.2.7, OS-INSP-1.2.8], note: "Аудит T-164 (Д-079): запрет дозагрузки в PARSING есть в коде и тесте, а правило OS-INSP-1.2.7 формально разрешает дозагрузку до финализации — правило — T-170", partial: true}
          - {id: TZA-9.1.10-03, t: "Верификация разрешена в READY и VERIFYING", kind: F, method: T, accept: "Матрица «статус × верификация» соблюдена", trace: [OS-INSP-4.3.3]}

  # ─────────────────────────────────────────────── 9.2 Сравнение и протокол
  - id: S9.2
    title: "Модуль сравнения и формирования протокола (детально)"
    items:
      - id: TZ-9.2.0
        new: true
        find: "Назначение: формирование доказательной группы"
        title: "Единица результата — доказательная группа"
        atoms:
          - {id: TZA-9.2.0-01, t: "Единица результата — «объект + параметр/правило + актуальные ПД/РД/ИД», а не страница или файл", kind: D, method: I, accept: "checks.evidence_group_id на объект и параметр", trace: [DO-CHECK, OS-INSP-3.1.15]}
          - {id: TZA-9.2.0-02, t: "Содержание и оформление протокола соответствуют образцу Приложения № 2", kind: I, method: I, accept: "Протокол совпадает по составу с образцом", trace: [OS-INSP-5.1.6], note: "Приложение № 2 получено в пакете участника (SRC-INSP-08); PDF и DOCX протокола повторяют семь разделов образца — OS-INSP-5.1.6, T-121 (GAP-INSP-02 закрыт)"}
      - id: TZ-9.2.1
        title: "Фиксация версий в запуске"
        atoms:
          - {id: TZA-9.2.1-01, t: "Версии Матрицы, набора данных и модели фиксируются в каждом запуске и в протоколе", kind: D, method: T, accept: "matrix/dataset/model_version и input_manifest_hash в протоколе", trace: [OS-INSP-3.3.1]}
      - id: TZ-9.2.2
        title: "Сценарии загрузки"
        atoms:
          - {id: TZA-9.2.2-01, t: "ПД+РД+ИД → FULL", kind: F, method: T, accept: "Сценарий FULL", trace: [OS-INSP-1.4.2]}
          - {id: TZA-9.2.2-02, t: "ПД+РД → PD_RD_ONLY; ПД+ИД → PD_ID_ONLY; РД+ИД → RD_ID_ONLY", kind: F, method: T, accept: "Парные сценарии определяются", trace: [OS-INSP-1.4.2]}
          - {id: TZA-9.2.2-03, t: "Один тип → SINGLE_ONLY", kind: F, method: T, accept: "Сценарий SINGLE_ONLY", trace: [OS-INSP-1.4.2]}
          - {id: TZA-9.2.2-04, t: "Частичная загрузка (например, 5 из 15 файлов ИД) → PARTIALLY_LOADED", kind: F, method: T, accept: "Сценарий PARTIALLY_LOADED по реестру", trace: [OS-INSP-1.4.2, OS-INSP-1.4.3]}
      - id: TZ-9.2.3
        title: "Логика по параметру"
        atoms:
          - {id: TZA-9.2.3-01, t: "Сначала проверяются применимость, комплектность, актуальность и сопоставимость; затем сравнение", kind: F, method: T, accept: "Порядок проверок соблюдён", trace: [OS-INSP-3.1.1]}
          - {id: TZA-9.2.3-02, t: "При сопоставимых источниках — expected, actual, delta и статус CANDIDATE или NEGATIVE_VERIFIED", kind: F, method: T, accept: "Кандидат содержит expected, actual, delta", trace: [OS-INSP-3.1.5, OS-INSP-3.1.6]}
          - {id: TZA-9.2.3-03, t: "CONFIRMED_VIOLATION присваивает только инспектор", kind: F, method: T, accept: "Система никогда не ставит CONFIRMED_VIOLATION", trace: [OS-INSP-3.1.7]}
          - {id: TZA-9.2.3-04, t: "Если правилу достаточно двух стадий — парное сравнение; неприменимая стадия — NOT_APPLICABLE", kind: F, method: T, accept: "Отсутствующая стадия отмечена в stage_notes", trace: [OS-INSP-3.1.8]}
          - {id: TZA-9.2.3-05, t: "Нет обязательного источника → MISSING_EVIDENCE без включения в нарушения", kind: F, method: T, accept: "MISSING_EVIDENCE не считается нарушением", trace: [OS-INSP-3.1.2]}
          - {id: TZA-9.2.3-06, t: "Недостаточно доказательств или источники несопоставимы → NOT_COMPARABLE или CLARIFICATION_REQUIRED", kind: F, method: T, accept: "Несопоставимые значения → NOT_COMPARABLE; нехватка доказательств → NOT_COMPARABLE или CLARIFICATION_REQUIRED; ни то ни другое не нарушение", trace: [OS-INSP-3.1.3, OS-INSP-3.1.4], note: "Аудит T-164 (Д-035): при нехватке источников код ставит MISSING_EVIDENCE («Недостаточно источников для сравнения», compare.ts), а не NOT_COMPARABLE или CLARIFICATION_REQUIRED", partial: true}
          - {id: TZA-9.2.3-07, t: "Учитывается согласованное изменение, отменяющее исходное требование", kind: F, method: T, accept: "Кандидат с согласованным изменением не признаётся нарушением", trace: [OS-INSP-1.5.1, OS-INSP-3.1.9], note: "Реестр изменений объекта; карточка кандидата показывает изменение, решение — за инспектором (причина APPROVED_CHANGE)"}
      - id: TZ-9.2.4
        title: "Состав протокола и карточка доказательства"
        atoms:
          - {id: TZA-9.2.4-01, t: "Протокол — структурированный документ JSON/PDF", kind: I, method: T, accept: "Протокол выгружается в JSON и PDF", trace: [OS-INSP-5.1.1, OS-INSP-5.1.20, OS-INSP-5.1.21]}
          - {id: TZA-9.2.4-02, t: "Раздел «Статус загрузки документов» и раздел «Тип проверки»", kind: I, method: T, accept: "Разделы присутствуют", trace: [OS-INSP-3.3.2]}
          - {id: TZA-9.2.4-03, t: "Раздельные таблицы: комплектность; кандидаты; подтверждённые; отрицательные; гипотезы", kind: I, method: T, accept: "Пять разделов", trace: [OS-INSP-3.3.2]}
          - {id: TZA-9.2.4-04, t: "Карточка: finding_id, код, expected/actual, file_id и SHA-256 каждого источника, стадия, шифр, редакция, статус утверждения, лист, bbox, обоснование, риск, решение и причина", kind: D, method: T, accept: "Все поля карточки заполнены", trace: [OS-INSP-2.2.1, OS-INSP-4.1.1]}
      - id: TZ-9.2.5
        title: "Сохранение протокола"
        atoms:
          - {id: TZA-9.2.5-01, t: "Протокол сохраняется в таблицу Protocols с присвоением версии", kind: D, method: T, accept: "Версия протокола в protocols", trace: [OS-INSP-3.3.4, DO-PROTOCOL]}
          - {id: TZA-9.2.5-02, t: "Статус процесса → READY; инспектор получает уведомление", kind: F, method: T, accept: "READY и уведомление инспектору", trace: [OS-INSP-3.3.3]}
      - id: TZ-9.2.6
        title: "Инкрементальный пересчёт"
        atoms:
          - {id: TZA-9.2.6-01, t: "При дозагрузке пересчитываются только параметры с новыми данными", kind: F, method: T, accept: "Решения по незатронутым параметрам сохраняются", trace: [OS-INSP-3.3.4, OS-INSP-3.3.6]}
          - {id: TZA-9.2.6-02, t: "Предыдущая версия протокола сохраняется в истории", kind: D, method: T, accept: "Версия v1 доступна после v2", trace: [OS-INSP-3.3.4]}
      - id: TZ-9.2.7
        title: "Статусы параметров в протоколе"
        atoms:
          - {id: TZA-9.2.7-01, t: "Уровень риска — только очерёдность экспертной проверки, не статус нарушения и не основание для предписания или приостановки работ", kind: C, method: D, accept: "В интерфейсе и протоколе оговорено", trace: [DLG-INSP-09]}
          - {id: TZA-9.2.7-02, t: "Статусы NEGATIVE_VERIFIED, CANDIDATE, CONFIRMED_VIOLATION, MISSING_EVIDENCE, NOT_APPLICABLE, NOT_COMPARABLE, CLARIFICATION_REQUIRED, SUSPICION с правилом включения в нарушения", kind: F, method: T, accept: "В число нарушений входит только CONFIRMED_VIOLATION", trace: [OS-INSP-3.1.7, OS-INSP-3.2.2]}
          - {id: TZA-9.2.7-03, t: "Просмотр по выборке: инспектор принимает партию системных «расхождения нет» по случайной выборке с актом приёмки", kind: F, method: T, accept: "Партия формируется из системных NEGATIVE_VERIFIED, выборка по seed, ошибка в выборке — партия не принята, иначе акт приёмки", trace: [OS-INSP-4.1.8, OS-INSP-4.1.9, OS-INSP-4.1.10, OS-INSP-4.1.11], note: "Добавлен аудитом детальной трассы (T-164, Д-026): действие «Просмотр по выборке» из таблицы §9.2"}
          - {id: TZA-9.2.7-04, t: "Действия инспектора по статусу группы: подтвердить применимость, выбрать авторитетную редакцию и зафиксировать основание, уточнить состав и качество данных, определить дальнейшее действие в пределах полномочий", kind: F, method: T, accept: "Для каждого действия из колонки «Действие инспектора» таблицы §9.2 есть операция в интерфейсе с записью в журнал", trace: [], note: "Добавлен аудитом детальной трассы (T-164, Д-027, Д-083): действия из колонки «Действие инспектора» не разложены ни в одно правило модели"}

  # ─────────────────────────────────────────────── 9.3 Верификация
  - id: S9.3
    title: "Модуль верификации инспектором (детально)"
    items:
      - id: TZ-9.3.0
        new: true
        find: "Статусы верификации"
        title: "Статусы верификации"
        atoms:
          - {id: TZA-9.3.0-01, t: "Статусы: PENDING, CONFIRMED_VIOLATION, NEGATIVE_VERIFIED, CLARIFICATION_REQUIRED, VERIFICATION_COMPLETED, PROTOCOL_FINALIZED", kind: F, method: T, accept: "Статусы отображаются и соблюдаются", trace: [OS-INSP-4.1.2, OS-INSP-4.3.3]}
      - id: TZ-9.3.1
        title: "Что видит инспектор"
        atoms:
          - {id: TZA-9.3.1-01, t: "Одновременно видны ожидаемое и фактическое значения", kind: I, method: D, accept: "Две ячейки на карточке", trace: [OS-INSP-4.1.1, DLG-INSP-09]}
          - {id: TZA-9.3.1-02, t: "Видны страницы ПД/РД/ИД с выделенными областями", kind: I, method: D, accept: "Листы с рамками bbox", trace: [OS-INSP-4.1.1, DLG-INSP-09]}
          - {id: TZA-9.3.1-03, t: "Видны шифры, редакции, статус утверждения", kind: I, method: D, accept: "Источники с шифром и редакцией", trace: [DLG-INSP-09]}
          - {id: TZA-9.3.1-04, t: "Видна ссылка на согласованное изменение", kind: I, method: D, accept: "Ссылка на изменение в карточке", trace: [OS-INSP-3.1.9]}
          - {id: TZA-9.3.1-05, t: "Статусы комплектности отображаются отдельно от кандидатов", kind: I, method: D, accept: "Отдельные группы", trace: [DLG-INSP-06]}
      - id: TZ-9.3.2
        title: "Действия инспектора"
        atoms:
          - {id: TZA-9.3.2-01, t: "«Подтвердить» → CONFIRMED_VIOLATION с user_id, timestamp, комментарием", kind: F, method: T, accept: "Решение с автором и временем", trace: [OS-INSP-4.1.2]}
          - {id: TZA-9.3.2-02, t: "«Отклонить» → NEGATIVE_VERIFIED; обязательны reason_code и комментарий", kind: F, method: T, accept: "Без причины или комментария — отказ", trace: [OS-INSP-4.1.3, OS-INSP-4.1.23]}
          - {id: TZA-9.3.2-03, t: "«Требует уточнения» → CLARIFICATION_REQUIRED", kind: F, method: T, accept: "Статус уточнения", trace: [OS-INSP-4.1.4]}
          - {id: TZA-9.3.2-04, t: "Составной кандидат делится на атомарные findings; статуса PARTIALLY_CONFIRMED нет", kind: F, method: T, accept: "Разделение на части со своими доказательствами", trace: [OS-INSP-4.2.1, OS-INSP-4.2.2]}
      - id: TZ-9.3.3
        title: "Дозагрузка в ходе верификации"
        atoms:
          - {id: TZA-9.3.3-01, t: "Дозагрузка без сброса верификации; затем инкрементальная проверка", kind: F, method: T, accept: "Решения сохраняются после дозагрузки", trace: [OS-INSP-1.2.7, OS-INSP-3.3.4, OS-INSP-3.3.6]}
      - id: TZ-9.3.4
        title: "Финализация"
        atoms:
          - {id: TZA-9.3.4-01, t: "Финализация — только после обработки всех CANDIDATE или переноса в CLARIFICATION_REQUIRED", kind: F, method: T, accept: "С открытым кандидатом финализация отклоняется", trace: [OS-INSP-4.3.1]}
          - {id: TZA-9.3.4-02, t: "MISSING_EVIDENCE выводится отдельным перечнем и не становится нарушением", kind: F, method: T, accept: "Раздел missing_evidence", trace: [OS-INSP-4.3.2]}
          - {id: TZA-9.3.4-03, t: "В ИАИС «РиН» передаются только подтверждённые записи с версиями протокола, Матрицы, модели и реестром файлов", kind: I, method: T, accept: "Полезная нагрузка без неподтверждённых записей", trace: [OS-INSP-5.2.1], note: "Аудит T-164 (Д-087): версии протокола, Матрицы, модели и реестр файлов передаются в коде, правило OS-INSP-5.2.1 их не называет — правило — T-170", partial: true}
          - {id: TZA-9.3.4-04, t: "После финализации дозагрузка и изменение статусов невозможны", kind: F, method: T, accept: "409 на решение и дозагрузку", trace: [OS-INSP-4.3.3]}
      - id: TZ-9.3.5
        title: "Отмена финализации"
        atoms:
          - {id: TZA-9.3.5-01, t: "Отмена — только администратор или супервизор", kind: S, method: T, accept: "Инспектору — отказ", trace: [OS-INSP-4.4.1]}
          - {id: TZA-9.3.5-02, t: "Отмена фиксируется в журнале с обязательной причиной", kind: F, method: T, accept: "Запись FINALIZATION_CANCELLED с причиной", trace: [OS-INSP-4.4.1, OS-INSP-4.4.2]}
          - {id: TZA-9.3.5-03, t: "После отмены — VERIFICATION_COMPLETED, дозагрузка снова возможна", kind: F, method: T, accept: "Статус COMPLETED, дозагрузка принимается", trace: [OS-INSP-4.4.2]}
      - id: TZ-9.3.6
        title: "Юзабилити верификации"
        atoms:
          - {id: TZA-9.3.6-01, t: "Полный цикл верификации протокола (132 параметра, 14 нарушений) ≤ 30 минут у опытного пользователя", kind: Q, method: T, accept: "Замер на 5 инспекторах", trace: [NFR-VERIFY-30, OS-INSP-6.5.16], scope: prod, note: "Замер встроен в систему (журнал верификации, отчёт); цифру дают 5 живых инспекторов (T-077)"}
          - {id: TZA-9.3.6-02, t: "Не более 3 кликов на одно нарушение", kind: Q, method: D, accept: "Решение за 1–3 действия", trace: [OS-INSP-4.1.5]}
          - {id: TZA-9.3.6-03, t: "Юзабилити-тестирование на 5 инспекторах с доработкой до целевых метрик", kind: Q, method: T, accept: "Протокол юзабилити-теста", trace: [NFR-VERIFY-30], scope: prod, note: "Инструмент замера и форма протокола готовы; сам тест и доработка — с 5 живыми инспекторами (T-077)"}

  # ─────────────────────────────────────────────── 9.4 Дообучение
  - id: S9.4
    title: "Модуль обратной связи и управляемого дообучения (детально)"
    items:
      - id: TZ-9.4.1
        title: "Сценарии ИИ по действиям инспектора"
        atoms:
          - {id: TZA-9.4.1-01, t: "Отклонение → отрицательный пример в черновике набора; в dataset_version — после проверки куратором", kind: F, method: T, accept: "Отрицательный пример попадает в набор только через выпуск куратором", trace: [OS-INSP-6.1.1]}
          - {id: TZA-9.4.1-02, t: "Запрос уточнения → показать источники, координаты и конфликт редакций; не включать в GOLD", kind: F, method: T, accept: "CLARIFICATION_REQUIRED не входит в GOLD", trace: [OS-INSP-6.1.1]}
