          - {id: TZA-9.5-07, t: "Перевод SUSPICION в CANDIDATE — только с источниками и координатами доказательств", kind: F, method: T, accept: "Гипотеза с доказательствами становится кандидатом", trace: [OS-INSP-3.2.7]}

