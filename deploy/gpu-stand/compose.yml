# Стенд «nadzorium-gpu» (T-185, решение владельца 28.09): полноценный стенд с реальной обработкой на GPU-сервере
# HOSTKEY 54831 (158.255.3.179, RTX 4090) — nadzorium-gpu.almazrobots.ru. Владелец смотрит там свежие результаты онлайн.
# Демо nadzorium.almazrobots.ru (hk-ru, только просмотр, T-131) не затрагивается.
#
# Состав — как deploy/stand (API в профиле dev: очередь RabbitMQ, PostgreSQL 18, TLS 1.3 между сервисами), но:
#   • ML — профиль gpu: образ цели gpu (T-230), кэш разбора Redis (ТЗ 9.1.5), VLM через vLLM на хосте — контейнеры
#     vllm-reader (:8000), vllm-judge (:8001) и маршрутизатор :8010 запускает deploy/gpu-stand/vllm.sh (ревизии HF закреплены). check_vlm_url пускает открытый http только на петлю, поэтому ML живёт в сети хоста
#     (network_mode: host) и слушает только адрес моста docker0 (172.17.0.1:48811) — снаружи сервера недоступен;
#     API ходит к нему по имени ml-gpu (extra_hosts) по TLS 1.3 с сертификатом CA стенда.
#   • Хранилище блобов — каталог /opt/stand-gpu/blobs (INSPECTOR_BLOB_STORE=fs), S3 не нужен. Тот же каталог —
#     --import-dir загрузчика (серверный импорт файлов > 50 МБ, T-169).
#   • Вход снаружи — Caddy (сеть хоста, 80/443): Let's Encrypt, basic auth (в документах ФИО), Bearer к /api/* пропускается.
#   • Все прочие порты — только 127.0.0.1 или 172.17.0.1. Порты 127.0.0.1:45810–45829 заняты стендом W1 — не брать.
# Образы — готовые (ADR-0005): inspector-gpu-{api,web,ml}:<sha main> (scripts/gpu-stand.sh images — тег поверх
# сборки w1-main-*), сторонние — по digest (GPU_* в /opt/stand-gpu/stand.env, их пишет scripts/gpu-stand.sh).
name: nadzorium-gpu

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE — postgres по digest}
    user: "70:70"
    mem_limit: 4g
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pg-tls/server.crt
      - -c
      - ssl_key_file=/run/pg-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - shared_buffers=512MB
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: inspector
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer --encoding=UTF8 --locale=C.UTF-8"
    secrets: [pg_superuser_password, pg_migrator_password, pg_app_password]
    tmpfs: [/tmp, /var/run/postgresql]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../gpu/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../gpu/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${STAND_VAR:?STAND_VAR — /opt/stand-gpu}/tls/postgres:/run/pg-tls:ro
    shm_size: 512m
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inspector_app", "-d", "inspector"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Схема и пять демо-учёток (ТЗ 12.1, пароль — secrets/demo_password); вход владельца — inspector
  api-migrate:
    <<: *hardened
    restart: "no"
    image: ${API_IMAGE:?API_IMAGE — inspector-gpu-api:<sha>}
    command: ["node", "apps/api/dist/migrate.mjs"]
    environment:
      INSPECTOR_PROFILE: dev
      INSPECTOR_DATABASE_URL: postgres://inspector_migrator@postgres:5432/inspector
      INSPECTOR_DATABASE_PASSWORD_FILE: /run/secrets/pg_migrator_password
      INSPECTOR_DATABASE_SSL_CA_FILE: /run/tls/ca.crt
      INSPECTOR_BOOTSTRAP_ADMIN_LOGIN: admin
      INSPECTOR_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets: [pg_migrator_password, bootstrap_admin_password]
    healthcheck: { disable: true }
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/tls/ca.crt:/run/tls/ca.crt:ro
      - ${STAND_VAR:?}/secrets/demo_password:/app/var/demo-password.txt:ro
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardened
    image: ${API_IMAGE:?}
    mem_limit: 6g
    environment:
      INSPECTOR_PROFILE: dev
      INSPECTOR_QUEUE: amqp
      INSPECTOR_AMQP_URL: amqps://inspector@rabbitmq:5671
      INSPECTOR_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_password
      INSPECTOR_PARSE_CONCURRENCY: ${GPU_PARSE_CONCURRENCY:-8}  # 4090: 8 файлов разом держат GPU загруженной (T-165)
      INSPECTOR_PARSE_CHUNK_PAGES: ${GPU_PARSE_CHUNK_PAGES:-0}  # T-233: том больше стольких страниц — частями на разных процессах ML (0 — целиком)
      INSPECTOR_PARSE_PART_CONCURRENCY: ${GPU_PARSE_PART_CONCURRENCY:-3}
      INSPECTOR_AV: "off"
      INSPECTOR_RIN_MOCK: "1"
      INSPECTOR_RIN_PULL: "off"
      # адрес клиента из X-Forwarded-For — только от своих прокси (Caddy на хосте → nginx в сети compose), OWASP T-140 E1-H1
      INSPECTOR_TRUST_PROXY: "loopback, uniquelocal"
      HOST: 0.0.0.0
      INSPECTOR_TLS_CERT: /run/tls/server.crt
      INSPECTOR_TLS_KEY: /run/tls/server.key
      INSPECTOR_HEALTH_CA_FILE: /run/tls/ca.crt
      INSPECTOR_DATABASE_URL: postgres://inspector_app@postgres:5432/inspector
      INSPECTOR_DATABASE_PASSWORD_FILE: /run/secrets/pg_app_password
      INSPECTOR_DATABASE_SSL_CA_FILE: /run/tls/ca.crt
      INSPECTOR_BLOB_STORE: fs
      INSPECTOR_BLOB_DIR: /app/var/blobs
      INSPECTOR_ML_URL: https://ml-gpu:${STAND_ML_PORT:-48811}
      INSPECTOR_INTERNAL_TLS: required
      INSPECTOR_ML_CA_FILE: /run/tls/ca.crt
      INSPECTOR_MIGRATIONS: verify
      NODE_EXTRA_CA_CERTS: /run/tls/ca.crt
      INSPECTOR_ML_TIMEOUT_MS: "3600000"
    secrets: [pg_app_password, rabbitmq_password]
    tmpfs: [/tmp]
    # блобы — каталог хоста: API пишет (uid 1000), ML читает, загрузчик кладёт туда большие файлы (--import-dir)
    volumes:
      - ${STAND_VAR:?}/blobs:/app/var/blobs
      - ${STAND_VAR:?}/tls/api:/run/tls:ro
    extra_hosts: ["ml-gpu:${STAND_GATEWAY:-172.17.0.1}"]
    networks: [edge, backend, db]
    depends_on:
      postgres: { condition: service_healthy }
      api-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      ml: { condition: service_healthy }

  # ML, профиль gpu. Сеть хоста — ради vLLM на 127.0.0.1:8000 (открытый http только на петле, SEC-09).
  ml:
    <<: *hardened
    # образ цели gpu (ml/Dockerfile --target gpu, T-230): RapidOCR + ONNX Runtime CUDA, веса PP-OCR в образе со сверкой SHA-256
    image: ${ML_GPU_IMAGE:?ML_GPU_IMAGE — inspector-gpu-ml:<sha> цели gpu}
    network_mode: host
    pids_limit: 8192  # T-233: 4 процесса ML × пул растеризации × потоки OCR/VL — 1024 давало «can't start new thread»
    cpus: ${GPU_ML_CPUS:-28}  # T-233: растеризация в пуле процессов — ядра заняты делом, 4 — API, vLLM, БД
    mem_limit: ${GPU_ML_MEM:-40g}  # T-233: 4 процесса ML × пул растеризации × растры страниц
    environment:
      INSPECTOR_PROFILE: gpu
      HOST: ${STAND_GATEWAY:-172.17.0.1}
      PORT: "${STAND_ML_PORT:-48811}"
      INSPECTOR_CACHE: redis
      INSPECTOR_REDIS_URL: rediss://127.0.0.1:${STAND_REDIS_PORT:-46379}/0?ssl_ca_certs=/run/tls/ca.crt
      INSPECTOR_LLM_PROVIDER: none
      INSPECTOR_OCR_WORKERS: ${GPU_OCR_WORKERS:-8}
      # арена CUDA PP-OCR (T-232): рядом судья (0,68) и читатель (0,22) — свободно ≈ 2,4 ГБ; вход детектора и куски листа
      # подстраиваются под арену (ocr_gpu.det_side / det_pieces), крупный лист режется на большее число кусков
      INSPECTOR_PPOCR_GPU_MB: ${GPU_PPOCR_GPU_MB:-1024}
      # T-233: распознаватель пачками по 8 строк — 32 широкие строки чертежа не помещались в арену 1 ГБ (BFCArena, Mul.12)
      INSPECTOR_PPOCR_REC_BATCH: ${GPU_PPOCR_REC_BATCH:-8}
      # T-233: процессов ML — у каждого своя растеризация pdfium (замок процесса) и своя модель OCR; один процесс держал GPU
      # на 45 % пилой (стр. рисуются по одной). 3 × арена 1 ГБ рядом с судьёй и читателем
      INSPECTOR_ML_WORKERS: ${GPU_ML_WORKERS:-4}
      # T-233: фаза видеопамяти — off: массовый разбор, судья выгружен (phase.sh A); on: сверка с судьёй (phase.sh B)
      INSPECTOR_JUDGE_PHASE: ${GPU_JUDGE_PHASE:-on}
      # T-233: первичный проход по корпусу — виды извлекателей, выключенные на этот проход (geometry_mentions — CV чертежей на CPU)
      INSPECTOR_SKIP_KINDS: ${GPU_SKIP_KINDS:-}
      # T-233: страницы рисуются в пуле процессов без замка pdfium — 4 × 5 = 20 ядер на растеризацию
      INSPECTOR_RENDER_PROCS: ${GPU_RENDER_PROCS:-5}
      INSPECTOR_VLM_BACKEND: openai
      # маршрутизатор по полю model (T-165): PaddleOCR-VL → vLLM :8000, Qwen → vLLM :8001; одна модель на процесс vLLM
      INSPECTOR_VLM_URL: ${GPU_VLM_URL:-http://127.0.0.1:8010/v1}
      INSPECTOR_VLM_READER: ${GPU_VLM_READER:-PaddlePaddle/PaddleOCR-VL-1.5}
      # судья — models.yaml gpu_equivalent; vLLM :8001, FP8 (T-165)
      INSPECTOR_VLM_JUDGE: ${GPU_VLM_JUDGE:-Qwen/Qwen3.5-9B}
      # тома ИД до 3956 стр. (T-165): защитный предел разбора поднят, формат разбора не меняется
      INSPECTOR_MAX_PAGES: ${GPU_MAX_PAGES:-5000}
      INSPECTOR_READER_CACHE: /app/var/readers
      INSPECTOR_BLOB_DIR: /app/var/blobs
      INSPECTOR_ML_TLS_CERT: /run/tls/server.crt
      INSPECTOR_ML_TLS_KEY: /run/tls/server.key
      INSPECTOR_HEALTH_CA_FILE: /run/tls/ca.crt
    tmpfs: [/tmp]
    # видеокарта для PP-OCR (ONNX Runtime CUDA); vLLM на той же 4090 — отдельные контейнеры (vllm.sh)
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    volumes:
      - ${STAND_VAR:?}/blobs:/app/var/blobs:ro
      - ${STAND_VAR:?}/readers:/app/var/readers
      - ${STAND_VAR:?}/tls/ml:/run/tls:ro
    # проверка образа ходит на 127.0.0.1:8811 — здесь ML слушает 172.17.0.1:48811
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,sys,urllib.request as u;c=ssl.create_default_context(cafile='/run/tls/ca.crt');b=u.urlopen('https://ml-gpu:${STAND_ML_PORT:-48811}/health',timeout=6,context=c).read();sys.exit(0 if b'\"status\":\"ok\"' in b else 1)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 120s
    extra_hosts: ["ml-gpu:${STAND_GATEWAY:-172.17.0.1}"]
    depends_on:
      redis: { condition: service_healthy }

  # Кэш разбора ML (профиль gpu). Только TLS 1.3, публикуется на петлю хоста — ML в сети хоста. AOF: кэш переживает перезапуск.
  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:?REDIS_IMAGE — redis по digest}
    mem_limit: 10g
    command:
      - redis-server
      - --maxmemory
      - 8gb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --dir
      - /data
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/tls/server.crt
      - --tls-key-file
      - /run/tls/server.key
      - --tls-ca-cert-file
      - /run/tls/ca.crt
      - --tls-auth-clients
      - "no"
      - --tls-protocols
      - TLSv1.3
    user: "999:1000"
    volumes:
      - redis-data:/data
      - ${STAND_VAR:?}/tls/redis:/run/tls:ro
    ports: ["127.0.0.1:${STAND_REDIS_PORT:-46379}:6379"]
    networks: [cache]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/tls/ca.crt -h 127.0.0.1 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  rabbitmq:
    <<: *hardened
    read_only: false
    user: "100:101"
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE — rabbitmq по digest}
    mem_limit: 2g
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ${STAND_VAR:?}/rabbitmq-auth.conf:/etc/rabbitmq/conf.d/10-auth.conf:ro
      - ../gpu/rabbitmq/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ${STAND_VAR:?}/tls/rabbitmq:/run/tls:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    <<: *hardened
    image: ${WEB_IMAGE:?WEB_IMAGE — inspector-gpu-web:<sha>}
    user: "101:101"
    mem_limit: 256m
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/tls/web:/run/tls:ro
    ports: ["127.0.0.1:${STAND_WEB_PORT:-46443}:8443"]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

  # Вход снаружи: 80/443, TLS Let's Encrypt, basic auth. Сеть хоста — проксирует на web 127.0.0.1:46443.
  caddy:
    <<: *hardened
    image: ${CADDY_IMAGE:?CADDY_IMAGE — caddy по digest}
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    tmpfs: [/tmp]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STAND_VAR:?}/caddy/users.caddy:/etc/caddy/users.caddy:ro
      - ${STAND_VAR:?}/tls/ca.crt:/etc/caddy/stand-ca.crt:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }

networks:
  edge: {}
  backend:
    internal: true
  db:
    internal: true
  cache: {}

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}

secrets:
  pg_superuser_password: { file: "${STAND_VAR:?}/secrets/pg_superuser_password" }
  pg_migrator_password: { file: "${STAND_VAR:?}/secrets/pg_migrator_password" }
  pg_app_password: { file: "${STAND_VAR:?}/secrets/pg_app_password" }
  bootstrap_admin_password: { file: "${STAND_VAR:?}/secrets/bootstrap_admin_password" }
  rabbitmq_password: { file: "${STAND_VAR:?}/secrets/rabbitmq_password" }
