# SSH GPU-сервера 158.255.3.179 (T-185, OWASP-0190): только ключи. Ставится как /etc/ssh/sshd_config.d/00-hardening.conf —
# раньше 50-cloud-init.conf (PasswordAuthentication yes), а в sshd побеждает первое значение.
# Проверка: sshd -t && systemctl reload ssh (открытые сессии не рвутся), затем новый вход по ключу из второго окна.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
# MaxStartups 200:30:400 поднят владельцем под параллельные сессии агентов (инцидент sshd 28.09) — не трогаем:
# без паролей неудачная попытка отбивается за миллисекунды, перебор не держит слоты.
