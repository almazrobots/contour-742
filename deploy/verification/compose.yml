# T-244: module-only API. No ML/Reader lifecycle, no background inspection recovery.
name: nadzorium-verification
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    command: [postgres, -c, hba_file=/etc/postgresql/pg_hba.conf, -c, ssl=on, -c, ssl_cert_file=/run/pg-tls/server.crt, -c, ssl_key_file=/run/pg-tls/server.key, -c, ssl_min_protocol_version=TLSv1.3]
    environment:
      POSTGRES_DB: inspector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer --encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql
      - /opt/stand-gpu/tls/postgres:/run/pg-tls:ro
      - /opt/stand-gpu/secrets/pg_superuser_password:/run/secrets/pg_superuser_password:ro
      - /opt/stand-gpu/secrets/pg_migrator_password:/run/secrets/pg_migrator_password:ro
      - /opt/stand-gpu/secrets/pg_app_password:/run/secrets/pg_app_password:ro
      - ${VERIFICATION_DEPLOY_ROOT:?}/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${VERIFICATION_DEPLOY_ROOT:?}/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [db]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, inspector_app, -d, inspector]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: ${VERIFICATION_API_IMAGE:?}
    command: [node, apps/api/dist/verification-server.mjs]
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["65532"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m", "/app/var:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    ports: ["127.0.0.1:48844:8810"]
    environment:
      HOST: 0.0.0.0
      INSPECTOR_PROFILE: dev
      INSPECTOR_MIGRATIONS: verify
      INSPECTOR_DATABASE_URL: ${VERIFICATION_DATABASE_URL:?}
      INSPECTOR_DATABASE_PASSWORD_FILE: /run/secrets/pg_app_password
      INSPECTOR_DATABASE_SSL_CA_FILE: /run/tls/ca.crt
      INSPECTOR_TLS_CERT: /run/tls/server.crt
      INSPECTOR_TLS_KEY: /run/tls/server.key
      INSPECTOR_HEALTH_CA_FILE: /run/tls/ca.crt
      INSPECTOR_VERIFICATION_CORPUS_DIR: /private/corpus
      INSPECTOR_VERIFICATION_STAGING_DIR: /private/staging
    volumes:
      - /opt/stand-gpu/tls/api:/run/tls:ro
      - /opt/stand-gpu/secrets/pg_app_password:/run/secrets/pg_app_password:ro
      - /opt/corpus/blobs:/private/corpus:ro
      - ${VERIFICATION_STAGING_ROOT:?}/reader:/private/staging/reader:ro
      - ${VERIFICATION_STAGING_ROOT:?}/structured:/private/staging/structured:ro
    networks: [db,edge]
  web:
    image: ${VERIFICATION_WEB_IMAGE:?}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    ports: ["127.0.0.1:48845:8443"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101", "/var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101", "/var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101"]
    volumes:
      - /opt/stand-gpu/tls/web:/run/tls:ro
    networks: [edge]
    depends_on: [api]
networks:
  edge: {}

  db:
    internal: true
volumes:
  postgres-data: {}
