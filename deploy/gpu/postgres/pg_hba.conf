# M-1, L-6 (аудит 2026-09-26): свой pg_hba вместо «host all all all scram-sha-256» и «local all all trust» образа.
# Первое совпадение выигрывает.
# TYPE     DATABASE   USER                                ADDRESS     METHOD
# Сокет внутри контейнера — только суперпользователь postgres своим uid (init-скрипты, обслуживание docker exec)
local      all        postgres                                        peer
# NFR-BACKUP (T-072): pg_basebackup службы pg-backup — сокетом из общего тома pg-run, тот же uid 70 («all» не покрывает replication)
local      replication postgres                                       peer
local      all        all                                             reject
# Сеть db (internal: true): только две роли приложения, только к базе inspector, только TLS (TLSv1.3 — ssl_min_protocol_version)
hostssl    inspector  inspector_app,inspector_migrator    0.0.0.0/0   scram-sha-256
hostssl    inspector  inspector_app,inspector_migrator    ::/0        scram-sha-256
# Без TLS — отказ всем; суперпользователь по сети не входит вовсе
hostnossl  all        all                                 0.0.0.0/0   reject
hostnossl  all        all                                 ::/0        reject
host       all        all                                 0.0.0.0/0   reject
host       all        all                                 ::/0        reject
