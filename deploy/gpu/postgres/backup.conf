# NFR-BACKUP (T-072, ТЗ 12.8, ТЗ 11: RPO ≤ 15 мин): непрерывная архивация WAL. Источник истины для двух мест:
#   deploy/gpu/compose.yml — те же строки флагами -c в command сервиса postgres (конфиг-файл образа не трогаем: его
#     создаёт initdb в томе данных); совпадение проверяет scripts/backup.test.mjs;
#   scripts/restore-drill.sh — учение читает этот файл и передаёт строки тем же способом.
# Формат: одна настройка на строку, «имя = значение», значение без кавычек (флаг -c берёт его как есть).
wal_level = replica
archive_mode = on
# Сегмент WAL — в том pg-wal-archive без перезаписи (wal-archive.sh); ненулевой код — PostgreSQL повторит позже
archive_command = sh /etc/postgresql/wal-archive.sh %p %f
# Незаполненный сегмент закрывается не реже раза в 5 минут: худший RPO — 300 с при пределе ТЗ 900 с
archive_timeout = 300
