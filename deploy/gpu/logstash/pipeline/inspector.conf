# ТЗ 13.6, TZA-7.11-03: централизованное хранение и поиск логов api и ml в Elasticsearch.
# Вход — драйвер docker gelf (compose.yml, x-elk-logging): строка stdout контейнера приходит в [message].
# Строка лога API — JSON ТЗ 13.1 (apps/api/src/services/audit.ts, formatLog):
#   timestamp, level, service, message, request_id, user_id (+ поля конкретного события).
# Маршрутизация и сроки хранения (ТЗ 12.5, 13.3; ILM в deploy/gpu/elasticsearch):
#   события безопасности → inspector-security (1 год), остальное INFO и выше → inspector-logs (90 дней),
#   DEBUG в хранилище не пишется (ТЗ 13.2).

input {
  gelf {
    port => 12201
    use_udp => true
    use_tcp => false
    # Раскладка полей закреплена явно: с 8.x по умолчанию ECS v8, и GELF-поля (level, host) уходят в ECS-пути.
    # Фильтры ниже рассчитаны на прежнюю раскладку — она не должна зависеть от мажорной версии образа (пин 9.5.3).
    ecs_compatibility => disabled
  }
}

filter {
  # Поле level из GELF — числовой syslog-уровень (6 — stdout, 3 — stderr). Уводим его в сторону,
  # чтобы строковый level из JSON-строки лога не конфликтовал с ним в маппинге.
  mutate { rename => { "level" => "[gelf][level]" } }

  json {
    source => "message"
    skip_on_invalid_json => true
    tag_on_failure => ["_inspector_not_json"]
  }

  if "_inspector_not_json" in [tags] or ![level] {
    # Не-JSON строка (трассировка Python, access-лог uvicorn): уровень — по потоку контейнера
    if [gelf][level] and [gelf][level] <= 3 {
      mutate { add_field => { "level" => "ERROR" } }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }
  }

  # ТЗ 13.2: DEBUG в эксплуатации не хранится
  if [level] == "DEBUG" {
    drop {}
  }

  # @timestamp — время события из строки лога, а не время приёма
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Стабильный маппинг: идентификаторы — строки (keyword), даже если пришли числом; service — из тега контейнера, если его нет в строке
  mutate { convert => { "request_id" => "string" "user_id" => "string" } }
  if ![service] {
    mutate { add_field => { "service" => "%{tag}" } }
  }

  # Признак события безопасности (ТЗ 12.3, 12.4; срок хранения 1 год — ТЗ 12.5, 13.3). Считается по тому,
  # что API реально пишет в лог сегодня:
  #   1) явное поле security: true — API ставит его на ответах 401/403/429 (apps/api/src/domain/access-log.ts);
  #   2) записи журнала аудита audit.ts: «audit LOGIN», «audit LOGOUT», «audit FILE_INFECTED» (антивирус,
  #      ТЗ 12.11), «audit FILE_SCAN_FAILED»;
  #   3) строка ответа app.ts onResponse «МЕТОД URL СТАТУС» со статусом 401 (неверный пароль, нет сессии),
  #      403 (отказ в доступе по роли), 429 (перебор пароля — LoginThrottle).
  # В хранилище безопасности уходят все такие события, включая INFO (успешный вход): ТЗ требует год для
  # ERROR и WARNING по безопасности, расследованию нужна и пара «отказы + успешный вход» — строже, не слабее.
  if [security] {
    mutate { add_tag => ["security"] }
  } else if [message] =~ /^audit (LOGIN|LOGIN_FAILED|LOGOUT|FILE_INFECTED|FILE_SCAN_FAILED)$/ {
    mutate { add_tag => ["security"] }
  } else if [message] =~ /^[A-Z]+ \S+ (401|403|429)$/ {
    mutate { add_tag => ["security"] }
  }
}

# NFR-TLS-INTERNAL: в Elasticsearch — только по TLS с проверкой сертификата по ca.crt стенда (ES_CA)
output {
  if "security" in [tags] {
    elasticsearch {
      hosts => ["${ES_URL}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["${ES_CA}"]
      user => "inspector_logstash"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      index => "inspector-security"
      action => "create"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_URL}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["${ES_CA}"]
      user => "inspector_logstash"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      index => "inspector-logs"
      action => "create"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
    }
  }
}
