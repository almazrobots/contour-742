# NFR-TLS-INTERNAL (ТЗ 1.3): брокер слушает только amqps 5671, TLS 1.3. Открытый AMQP 5672 выключен.
# Сертификат и ключ — из TLS_DIR стенда (SAN включает DNS:rabbitmq); клиентский сертификат не требуется,
# вход — логином и паролем внутри TLS.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/tls/ca.crt
ssl_options.certfile = /run/tls/server.crt
ssl_options.keyfile = /run/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
# Панель управления — только на петле контейнера (наружу не публикуется)
management.tcp.ip = 127.0.0.1
