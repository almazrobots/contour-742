# Стенд «stand» (NFR-STAND, T-129): локальный стенд на маке одной командой — scripts/stand.sh up [--minio|--yandex].
# CPU, без GPU, ELK, RabbitMQ и ClamAV: API в профиле dev (очередь в процессе, антивирус выключен явно — config.ts),
# но с тем же PostgreSQL, TLS и hardening, что профиль gpu (deploy/gpu/compose.yml).
# Образы — только готовые (ADR-0005, iac-standard): свои — inspector-*:<git-sha> из `scripts/stand.sh build`,
# сторонние — по digest из deploy/stand/images.env. Сборки здесь нет (без build:).
# Переменные (${…:?}) задаёт scripts/stand.sh в var/stand/stand.env; руками: docker compose --env-file var/stand/stand.env …
# NFR-TLS-INTERNAL (ТЗ 1.3): между сервисами открытого текста нет — web→api, api→ml, api→postgres, api→minio по TLS 1.3
# (MinIO — TLS ≥ 1.2, минимум не настраивается), сертификаты выпущены CA стенда (var/stand/tls, stand.sh secrets).
name: inspector-stand

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  # ADR-0003: тот же PostgreSQL 18, те же роли (init-скрипт и pg_hba — из профиля gpu, одна правда), TLS 1.3 verify-full.
  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE — postgres по digest (deploy/stand/images.env)}
    user: "70:70"
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pg-tls/server.crt
      - -c
      - ssl_key_file=/run/pg-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: inspector
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer --encoding=UTF8 --locale=C.UTF-8"
    secrets: [pg_superuser_password, pg_migrator_password, pg_app_password]
    tmpfs: [/tmp, /var/run/postgresql]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../gpu/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../gpu/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${STAND_VAR:?STAND_VAR — каталог var/stand}/tls/postgres:/run/pg-tls:ro
    shm_size: 256m
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inspector_app", "-d", "inspector"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # HIGH-1: одноразовая служба миграций — тот же образ API, роль inspector_migrator. Профиль dev: вместе со схемой
  # заводит пять демо-учёток (ТЗ 12.1) с паролем из var/stand/secrets/demo_password; первый admin из секрета
  # (как в gpu) тогда пропускается — users уже не пуст. Выход 0 — api стартует.
  api-migrate:
    <<: *hardened
    restart: "no"
    image: ${API_IMAGE:?API_IMAGE — inspector-api:<git-sha> (scripts/stand.sh build)}
    command: ["node", "apps/api/dist/migrate.mjs"]
    environment:
      INSPECTOR_PROFILE: dev
      INSPECTOR_DATABASE_URL: postgres://inspector_migrator@postgres:5432/inspector
      INSPECTOR_DATABASE_PASSWORD_FILE: /run/secrets/pg_migrator_password
      INSPECTOR_DATABASE_SSL_CA_FILE: /run/tls/ca.crt
      INSPECTOR_BOOTSTRAP_ADMIN_LOGIN: admin
      INSPECTOR_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets: [pg_migrator_password, bootstrap_admin_password]
    healthcheck: { disable: true } # одноразовая: HEALTHCHECK образа API здесь не к месту
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/tls/ca.crt:/run/tls/ca.crt:ro # только корень доверия: ключ API службе миграций не нужен
      # config.ts читает пароль демо-учёток из <INSPECTOR_ROOT>/var/demo-password.txt — файлом, не переменной
      - ${STAND_VAR:?}/secrets/demo_password:/app/var/demo-password.txt:ro
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardened
    image: ${API_IMAGE:?API_IMAGE — inspector-api:<git-sha> (scripts/stand.sh build)}
    # Режим хранилища блобов (ADR-0006): var/stand/s3.env пишет stand.sh по режиму up (--minio | --yandex | --fs);
    # там только адреса и имена, ключи — файлами-секретами ниже
    env_file: ["${STAND_VAR:?}/s3.env"]
    environment:
      INSPECTOR_PROFILE: dev
      # ТЗ 1.5: модули связаны через RabbitMQ — разбор файлов идёт очередью inspector.parse (повторы, dead-letter)
      INSPECTOR_QUEUE: amqp
      # пароль брокера — файлом-секретом, в адресе только пользователь (SEC-07: не виден в docker inspect)
      INSPECTOR_AMQP_URL: amqps://inspector@rabbitmq:5671
      INSPECTOR_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_password
      INSPECTOR_PARSE_CONCURRENCY: "3"
      INSPECTOR_AV: "off"
      INSPECTOR_RIN_MOCK: "1"
      INSPECTOR_RIN_PULL: "off"
      HOST: 0.0.0.0
      # NFR-TLS (ТЗ 12.3): API слушает только HTTPS, TLS 1.3
      INSPECTOR_TLS_CERT: /run/tls/server.crt
      INSPECTOR_TLS_KEY: /run/tls/server.key
      INSPECTOR_HEALTH_CA_FILE: /run/tls/ca.crt # HEALTHCHECK образа: цепочка по CA стенда
      INSPECTOR_DATABASE_URL: postgres://inspector_app@postgres:5432/inspector
      INSPECTOR_DATABASE_PASSWORD_FILE: /run/secrets/pg_app_password
      INSPECTOR_DATABASE_SSL_CA_FILE: /run/tls/ca.crt
      INSPECTOR_BLOB_DIR: /app/var/blobs
      # NFR-TLS-INTERNAL: ML по https; корень доверия — CA стенда (клиент ML и NODE_EXTRA_CA_CERTS для fetch/S3 SDK)
      INSPECTOR_ML_URL: https://ml:8811
      INSPECTOR_INTERNAL_TLS: required # config.ts откажет в старте, если ML окажется не по https
      INSPECTOR_ML_CA_FILE: /run/tls/ca.crt
      # схему накатывает api-migrate (ADR-0003); API ролью inspector_app только сверяет её (T-129)
      INSPECTOR_MIGRATIONS: verify
      NODE_EXTRA_CA_CERTS: /run/tls/ca.crt
      # Большие PDF на CPU мака разбираются десятками минут: API ждёт ML до 30 минут
      INSPECTOR_ML_TIMEOUT_MS: "1800000"
      INSPECTOR_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      INSPECTOR_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      INSPECTOR_S3_KEY_FILE: /run/secrets/s3_encryption_key
    secrets: [pg_app_password, s3_access_key_id, s3_secret_access_key, s3_encryption_key, rabbitmq_password]
    tmpfs: [/tmp]
    # Кэш блобов — том api-blobs: API пишет, ML читает (HIGH-4, ADR-0006 п. 1)
    volumes:
      - api-blobs:/app/var/blobs
      - ${STAND_VAR:?}/tls/api:/run/tls:ro
    # edge — выход наружу (Yandex Object Storage) и сосед web; backend — ML и MinIO; db — PostgreSQL.
    # Наружу API не публикуется: единственный вход — web (https://127.0.0.1:45843, прокси /api/).
    networks: [edge, backend, db]
    depends_on:
      postgres: { condition: service_healthy }
      api-migrate: { condition: service_completed_successfully }
      ml: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # в режиме --yandex и --fs MinIO не поднимается (профиль minio) — зависимость необязательна
      minio-init: { condition: service_completed_successfully, required: false }

  # ML на CPU: тот же образ, что в gpu (ансамбль Tesseract, ONNX без torch). Выхода в интернет нет (backend internal).
  ml:
    <<: *hardened
    image: ${ML_IMAGE:?ML_IMAGE — inspector-ml:<git-sha> (scripts/stand.sh build)}
    pids_limit: 512 # потоки onnxruntime и tesseract на 8–10 ядрах
    # Потолок ресурсов (T-129, требование владельца): параллельный OCR не отнимает у мака всё — 4 ядра из 8 VM и 8 ГБ;
    # сверху — диспетчер scripts/load-guard.sh (пауза ML при перегреве или нехватке памяти)
    cpus: 4 # замер 27.09: при 6 ядрах CPU мака 93 °C, при 4 — 77 °C; разбор идёт
    mem_limit: 8g
    environment:
      INSPECTOR_PROFILE: dev
      INSPECTOR_OCR_WORKERS: "4" # страниц-сканов одного документа параллельно (parse.py, вне замка pdfium)
      INSPECTOR_LLM_PROVIDER: none # LLM-сервера в стенде нет — советник честно отвечает available=false
      INSPECTOR_ML_CACHE: /app/var/ml-cache # кэш разбора — постоянный том: переживает перезапуск и сбой (T-129)
      INSPECTOR_BLOB_DIR: /app/var/blobs
      INSPECTOR_ML_TLS_CERT: /run/tls/server.crt
      INSPECTOR_ML_TLS_KEY: /run/tls/server.key
      INSPECTOR_HEALTH_CA_FILE: /run/tls/ca.crt
    tmpfs: [/tmp]
    volumes:
      - api-blobs:/app/var/blobs:ro
      - ml-cache:/app/var/ml-cache
      - ${STAND_VAR:?}/tls/ml:/run/tls:ro
    networks: [backend]

  # Брокер очередей (ТЗ 1.5): только amqps 5671, TLS 1.3 (deploy/gpu/rabbitmq/20-tls.conf — тот же конфиг, что в gpu)
  rabbitmq:
    <<: *hardened
    read_only: false # брокер пишет в собственный каталог данных и конфиг Erlang
    user: "100:101" # rabbitmq из образа: с cap_drop ALL вход образа не переключит пользователя сам
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE — rabbitmq по digest (deploy/stand/images.env)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # пользователь и пароль брокера — файлом conf.d (stand.sh secrets, 600), не переменными окружения (SEC-07)
      - ${STAND_VAR:?}/rabbitmq-auth.conf:/etc/rabbitmq/conf.d/10-auth.conf:ro
      - ../gpu/rabbitmq/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ${STAND_VAR:?}/tls/rabbitmq:/run/tls:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Интерфейс и единственный вход стенда: статика, /api/ и /health — прокси к API по TLS с проверкой по CA стенда
  web:
    <<: *hardened
    image: ${WEB_IMAGE:?WEB_IMAGE — inspector-web:<git-sha> (scripts/stand.sh build)}
    user: "101:101"
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/tls/web:/run/tls:ro
    # Только localhost и выше 40000 (чужие service worker на низких портах, CLAUDE.md)
    ports: ["127.0.0.1:45843:8443"]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

  # ─────────────── Паритет S3 (профиль minio, ADR-0006 п. 5): S3-совместимый сервер MinIO вместо Yandex Object Storage.
  # Официальный образ снят с Docker Hub; форк pgsty — сборка того же исходника; только для паритета в гейте и на стенде,
  # в прод не идёт (решение CTO 2026-09-27). Digest — deploy/stand/images.env.
  # Данные — var/stand/minio-data (bind mount): именованный том root:root не даёт писать uid 1000 без cap CHOWN.
  minio:
    <<: *hardened
    profiles: [minio]
    image: ${MINIO_IMAGE:?MINIO_IMAGE — minio по digest (deploy/stand/images.env)}
    user: "1000:1000"
    command: ["server", "/data", "--address", ":9000", "--certs-dir", "/run/minio-certs"]
    environment:
      HOME: /tmp
      MINIO_BROWSER: "off" # консоль не нужна: бакет создаёт minio-init
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_access_key
    secrets: [s3_access_key_id, s3_secret_access_key]
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/minio-data:/data
      - ${STAND_VAR:?}/tls/minio:/run/minio-certs:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/run/minio-certs/CAs/ca.crt", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Одноразово: бакет из s3.env (идемпотентно, --ignore-existing). mc — в том же образе MinIO, лишнего образа нет.
  # Ключи — из файлов-секретов в переменную окружения процесса mc (MC_HOST_*), не в argv и не в compose.
  minio-init:
    <<: *hardened
    profiles: [minio]
    restart: "no"
    image: ${MINIO_IMAGE:?}
    user: "1000:1000"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -eu;
        mkdir -p /tmp/mc/certs/CAs && cp /run/tls/ca.crt /tmp/mc/certs/CAs/ca.crt;
        MC_HOST_stand="https://$$(cat /run/secrets/s3_access_key_id):$$(cat /run/secrets/s3_secret_access_key)@minio:9000";
        export MC_HOST_stand;
        mc --config-dir /tmp/mc mb --ignore-existing "stand/$${INSPECTOR_S3_BUCKET:?}"
    env_file: ["${STAND_VAR:?}/s3.env"]
    environment:
      HOME: /tmp
    secrets: [s3_access_key_id, s3_secret_access_key]
    healthcheck: { disable: true }
    tmpfs: [/tmp]
    volumes:
      - ${STAND_VAR:?}/tls/ca.crt:/run/tls/ca.crt:ro
    networks: [backend]
    depends_on:
      minio: { condition: service_healthy }

networks:
  # вход (web) и выход наружу (API → Yandex Object Storage)
  edge: {}
  # API ↔ ML, API ↔ MinIO: без маршрута наружу — ML разбирает недоверенные PDF
  backend:
    internal: true
  # M-8: база без маршрута наружу — только postgres, api, api-migrate
  db:
    internal: true

volumes:
  api-blobs: {}
  postgres-data: {}
  rabbitmq-data: {}
  ml-cache: {}

# Файлы-секреты стенда — var/stand/secrets (вне git, 600), готовит scripts/stand.sh secrets. Ключи S3 — из каталога
# режима (S3_SECRETS_DIR: secrets/s3-minio или secrets/s3-yandex), ключ шифрования блобов — один на стенд.
secrets:
  pg_superuser_password:
    file: ${STAND_VAR:?}/secrets/pg_superuser_password
  pg_migrator_password:
    file: ${STAND_VAR:?}/secrets/pg_migrator_password
  pg_app_password:
    file: ${STAND_VAR:?}/secrets/pg_app_password
  bootstrap_admin_password:
    file: ${STAND_VAR:?}/secrets/bootstrap_admin_password
  s3_access_key_id:
    file: ${S3_SECRETS_DIR:?S3_SECRETS_DIR — каталог ключей S3 режима}/access_key_id
  s3_secret_access_key:
    file: ${S3_SECRETS_DIR:?}/secret_access_key
  # ADR-0006: ключ AES-256-GCM шифрования блобов на клиенте. Потеря файла = потеря данных в бакете
  s3_encryption_key:
    file: ${STAND_VAR:?}/secrets/s3_encryption_key
  rabbitmq_password:
    file: ${STAND_VAR:?}/secrets/rabbitmq_password
